<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MSRA" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>MSRA — Clinical &amp; Professional Dilemmas Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E🧭%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E🧭%3C/text%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100vh; background: #0a0e1a;
                 overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #dbe4f0;
           padding-left: env(safe-area-inset-left);
           padding-right: env(safe-area-inset-right); }
    button { font-family: inherit; touch-action: manipulation; }
    input, textarea { font-family: inherit; }
    input:not([type=range]), textarea { -webkit-appearance: none; appearance: none; }
    /* Custom slider — green to the left of the thumb, dark blue to the right.
       The fill percentage is set via the --pct CSS variable inline from React. */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: transparent;
      outline: none;
      accent-color: #2dd4bf;
      cursor: pointer;
      padding: 0;
      --pct: 0%;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right,
        #1c4a2a 0%, #1c4a2a var(--pct),
        #1c2a4a var(--pct), #1c2a4a 100%);
    }
    input[type=range]::-moz-range-track {
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right,
        #1c4a2a 0%, #1c4a2a var(--pct),
        #1c2a4a var(--pct), #1c2a4a 100%);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2dd4bf;
      border: 2px solid #ffffff;
      margin-top: -6px; /* centre on 6px track */
      box-shadow: 0 0 0 1px rgba(74,144,217,0.4);
      cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2dd4bf;
      border: 2px solid #ffffff;
      cursor: pointer;
    }
    /* Hide scrollbar in tab strip */
    .tab-strip::-webkit-scrollbar, .specialty-strip::-webkit-scrollbar { display: none; }
    .tab-strip, .specialty-strip { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    /* Touch targets ≥44px on iOS */
    @media (pointer: coarse) {
      button { min-height: 38px; }
    }
    /* iPhone — collapse the tracker sidebar into a horizontal strip */
    .tracker-sidebar { width: 200px; }
    .tracker-strip { display: none; }
    @media (max-width: 720px) {
      .tracker-sidebar { display: none; }
      .tracker-strip { display: flex; }
    }
    /* Canvas: stop the page scrolling while drawing */
    .pencil-canvas { touch-action: none; -webkit-user-select: none; user-select: none; }
    /* Pen-only mode: ignore touch on canvas (palm rejection) */
    .pencil-canvas.pen-only { touch-action: none; }
    /* Modal full-screen with safe area */
    .pencil-overlay {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
  <script src="vendor/react.min.js"></script>
  <script src="vendor/react-dom.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="notebook-data.js"></script>
  <script src="question-bank-data.js"></script>
  <script src="dilemmas-data.js"></script>
</head>
<body>
  <div id="root">
    <div style="padding:2rem;color:#888;font-family:monospace;text-align:center;">
      Loading… (first load compiles JSX in-browser, takes a couple of seconds)
    </div>
  </div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const SPECIALTIES = window.SPECIALTIES;
    const PHASES = window.PHASES;
    const TIPS = window.TIPS;
    // Effective study-plan timeline. Mutable so the exam date can be chosen by the
    // user; defaults fall back to the build-time constants in data.js (the 23 Sep
    // 2026 setup). setTimeline() keeps the derived values consistent.
    let EXAM_DATE = new Date(window.EXAM_DATE + "T00:00:00");
    let PLAN_START = new Date(window.PLAN_START + "T00:00:00");
    let PLAN_TOTAL_DAYS = 154; // calendar days from plan start to exam
    let DAYS_PER_STEP = 7;     // the 22 plan-"weeks" mapped onto PLAN_TOTAL_DAYS (<7 compresses, >7 stretches)
    let PLAN_WEEKS = 22;       // real calendar weeks today→exam, for header totals & feasibility

    // -------- Firebase init (sync across devices) --------
    let FIRESTORE = null;
    try {
      if (window.firebase && window.FIREBASE_CONFIG) {
        if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
        FIRESTORE = firebase.firestore();
        // Enable offline persistence — survives airplane mode, syncs on reconnect
        FIRESTORE.enablePersistence({ synchronizeTabs: true }).catch(() => {});
      }
    } catch (err) {
      console.warn("Firebase init failed:", err);
    }

    // generate readable sync codes like  m7k3-l9xq-pd4t-r8sy
    function generateSyncCode() {
      const chars = "abcdefghjkmnpqrstuvwxyz23456789"; // unambiguous chars
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      let s = "";
      for (let i = 0; i < 16; i++) {
        if (i > 0 && i % 4 === 0) s += "-";
        s += chars[bytes[i] % chars.length];
      }
      return s; // e.g. "m7k3-l9xq-pd4t-r8sy"
    }
    const isValidSyncCode = c =>
      typeof c === "string" && c.replace(/-/g, "").length >= 12 && c.replace(/-/g, "").length <= 32;
    const normaliseSyncCode = c => (c || "").toLowerCase().trim().replace(/[^a-z0-9-]/g, "");

    // Days since a timestamp (ms epoch). Returns whole days from today.
    function daysSince(ts) {
      if (!ts) return null;
      const now = stripTime(new Date()).getTime();
      const then = stripTime(new Date(ts)).getTime();
      return Math.max(0, Math.round((now - then) / MS_PER_DAY));
    }
    function fmtDaysShort(ts) {
      const d = daysSince(ts);
      if (d == null) return "";
      if (d === 0) return "today";
      return `${d}d`;
    }
    function fmtDaysLong(ts) {
      const d = daysSince(ts);
      if (d == null) return "";
      if (d === 0) return "today";
      if (d === 1) return "1 day";
      return `${d} days`;
    }
    function fmtSinceDate(ts) {
      if (!ts) return "";
      return new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    }

    const PRIORITY_COLORS = {
      HIGH: { bg: "#FEE2E2", text: "#991B1B", label: "High yield" },
      MED:  { bg: "#FEF9C3", text: "#854D0E", label: "Medium" },
      LOW:  { bg: "#F0FDF4", text: "#166534", label: "Lower yield" },
      EXAM: { bg: "#141a2b", text: "#ffffff", label: "EXAM DAY" },
    };

    const STATUS_CONFIG = {
      green:  { label: "Confident",      color: "#16a34a", bg: "#dcfce7", border: "#86efac" },
      yellow: { label: "Working on it",  color: "#d97706", bg: "#fef3c7", border: "#fcd34d" },
      red:    { label: "Struggling",     color: "#dc2626", bg: "#fee2e2", border: "#fca5a5" },
      none:   { label: "Not rated",      color: "#6b7280", bg: "transparent", border: "transparent" },
    };

    // -------- date / phase helpers --------
    const MS_PER_DAY = 1000 * 60 * 60 * 24;
    const stripTime = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };

    // Local YYYY-MM-DD (avoids the UTC off-by-one that toISOString can cause near midnight).
    function localISO(d = new Date()) {
      const x = new Date(d);
      return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
    }
    // Recompute the effective timeline from an exam date + plan start (both YYYY-MM-DD).
    // The plan is intrinsically 22 "steps" (4 phases over weeks 1-22); those steps are
    // mapped onto the real calendar between plan start and exam, so the plan compresses
    // or stretches to fit. When the span is exactly 22 weeks, DAYS_PER_STEP = 7 and the
    // behaviour is identical to the original fixed plan.
    function setTimeline(examStr, startStr) {
      const ex = new Date(examStr + "T00:00:00");
      const st = new Date(startStr + "T00:00:00");
      if (isNaN(ex) || isNaN(st)) return;
      EXAM_DATE = ex;
      PLAN_START = st;
      PLAN_TOTAL_DAYS = Math.max(7, Math.round((stripTime(ex) - stripTime(st)) / MS_PER_DAY));
      DAYS_PER_STEP = PLAN_TOTAL_DAYS / 22;
      PLAN_WEEKS = Math.max(1, Math.round(PLAN_TOTAL_DAYS / 7));
    }
    setTimeline(
      localStorage.getItem("msra_exam_date") || window.EXAM_DATE,
      localStorage.getItem("msra_plan_start") || window.PLAN_START
    );

    function getDaysUntilExam(today = new Date()) {
      return Math.max(0, Math.round((stripTime(EXAM_DATE) - stripTime(today)) / MS_PER_DAY));
    }
    function getCurrentWeek(today = new Date()) {
      const days = (stripTime(today) - stripTime(PLAN_START)) / MS_PER_DAY;
      if (days < 0) return 0;
      return Math.min(22, Math.floor(days / DAYS_PER_STEP) + 1);
    }
    function getCurrentPhaseIndex(week) {
      const idx = PHASES.findIndex(p => week >= p.weekStart && week <= p.weekEnd);
      return idx === -1 ? (week < 1 ? 0 : PHASES.length - 1) : idx;
    }
    function phaseBaselineHours(phase) {
      return +(5 * phase.weekdayHrsBase + 2 * phase.dayOffHrsBase).toFixed(2);
    }
    function totalBaselineHours() {
      return PHASES.reduce((sum, p) => sum + phaseBaselineHours(p) * (p.weekEnd - p.weekStart + 1), 0);
    }

    // -------- Apple Pencil note canvas --------
    const PEN_COLORS = ["#141a2b", "#dc2626", "#2563eb", "#16a34a", "#d97706", "#7c3aed"];

    function NoteCanvas({ initialDataUrl, onSave, onClose, title }) {
      const canvasRef = useRef(null);
      const wrapRef = useRef(null);
      const [tool, setTool] = useState("pen"); // pen | highlighter | eraser
      const [color, setColor] = useState("#141a2b");
      const [penOnly, setPenOnly] = useState(() => localStorage.getItem("msra_pen_only") === "1");
      const [hasPen, setHasPen] = useState(false); // ever seen a pen pointer?
      const drawing = useRef(false);
      const lastPt = useRef(null);
      const undoStack = useRef([]); // ImageData snapshots
      const dprRef = useRef(1);
      const sizeRef = useRef({ w: 0, h: 0 });

      useEffect(() => { localStorage.setItem("msra_pen_only", penOnly ? "1" : "0"); }, [penOnly]);

      // Setup canvas with DPR scaling, optionally restore initial PNG
      const setupCanvas = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const wrap = wrapRef.current;
        const rect = wrap.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        dprRef.current = dpr;
        sizeRef.current = { w: rect.width, h: rect.height };
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, rect.width, rect.height);
        if (initialDataUrl) {
          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0, rect.width, rect.height);
          };
          img.src = initialDataUrl;
        }
      }, [initialDataUrl]);

      useEffect(() => {
        setupCanvas();
        const onResize = () => setupCanvas();
        window.addEventListener("resize", onResize);
        window.addEventListener("orientationchange", onResize);
        return () => {
          window.removeEventListener("resize", onResize);
          window.removeEventListener("orientationchange", onResize);
        };
      }, [setupCanvas]);

      const getPos = e => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      };

      const snapshot = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        undoStack.current.push(data);
        if (undoStack.current.length > 20) undoStack.current.shift();
      };

      const persist = () => {
        try {
          const dataUrl = canvasRef.current.toDataURL("image/png");
          onSave(dataUrl);
        } catch {}
      };

      const onPointerDown = e => {
        if (e.pointerType === "pen") setHasPen(true);
        // Palm / touch rejection: when pen-only is on AND we've seen a pen, ignore touches
        if (penOnly && hasPen && e.pointerType === "touch") return;
        if (penOnly && e.pointerType === "touch" && !hasPen) {
          // First touch when no pen seen yet — still allow but flag for user
        }
        e.preventDefault();
        try { e.target.setPointerCapture(e.pointerId); } catch {}
        snapshot();
        drawing.current = true;
        const { x, y } = getPos(e);
        lastPt.current = { x, y, pressure: e.pressure || 0.5 };
      };

      const onPointerMove = e => {
        if (!drawing.current) return;
        if (penOnly && hasPen && e.pointerType === "touch") return;
        e.preventDefault();
        const { x, y } = getPos(e);
        const ctx = canvasRef.current.getContext("2d");
        const pressure = e.pressure && e.pressure > 0 ? e.pressure : (e.pointerType === "pen" ? 0.5 : 0.6);
        let lineWidth, strokeStyle, comp = "source-over";
        if (tool === "pen") {
          lineWidth = 1 + pressure * 3.2;
          strokeStyle = color;
        } else if (tool === "highlighter") {
          lineWidth = 14;
          strokeStyle = color + "55";
        } else { // eraser
          lineWidth = 22;
          strokeStyle = "rgba(0,0,0,1)";
          comp = "destination-out";
        }
        ctx.globalCompositeOperation = comp;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = strokeStyle;
        ctx.beginPath();
        ctx.moveTo(lastPt.current.x, lastPt.current.y);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.globalCompositeOperation = "source-over";
        lastPt.current = { x, y, pressure };
      };

      const onPointerUp = e => {
        if (!drawing.current) return;
        drawing.current = false;
        lastPt.current = null;
        persist();
      };

      const undo = () => {
        const stack = undoStack.current;
        if (!stack.length) return;
        const data = stack.pop();
        const ctx = canvasRef.current.getContext("2d");
        ctx.putImageData(data, 0, 0);
        persist();
      };

      const clear = () => {
        if (!confirm("Clear all notes for this condition?")) return;
        snapshot();
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(dprRef.current, 0, 0, dprRef.current, 0, 0);
        persist();
      };

      const toolBtn = (active, color = "#fff") => ({
        background: active ? "#2a4a8a" : "rgba(255,255,255,0.06)",
        border: `1px solid ${active ? "#4a8adc" : "rgba(255,255,255,0.15)"}`,
        color, padding: "0.5rem 0.7rem", borderRadius: 6, cursor: "pointer",
        fontSize: "0.78rem", fontFamily: "monospace", minWidth: 44, minHeight: 38,
        display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 4,
      });

      return (
        <div className="pencil-overlay" style={{
          position: "fixed", inset: 0, background: "rgba(8,8,14,0.96)", zIndex: 100,
          display: "flex", flexDirection: "column",
        }}>
          {/* Toolbar */}
          <div style={{
            padding: "0.6rem 0.75rem", display: "flex", flexWrap: "wrap",
            alignItems: "center", gap: "0.45rem",
            borderBottom: "1px solid rgba(255,255,255,0.1)", background: "#0f0f20",
          }}>
            <button onClick={() => { persist(); onClose(); }} style={toolBtn(false)} title="Close">
              ✕ Close
            </button>
            <div style={{
              fontSize: "0.78rem", color: "#9ab5cc", fontFamily: "monospace",
              flex: "1 1 140px", overflow: "hidden", textOverflow: "ellipsis",
              whiteSpace: "nowrap", padding: "0 0.4rem",
            }}>{title}</div>
            <button onClick={() => setTool("pen")}        style={toolBtn(tool === "pen", color)}        title="Pen">✏️ Pen</button>
            <button onClick={() => setTool("highlighter")} style={toolBtn(tool === "highlighter", "#d4a017")} title="Highlighter">🖍️ Hi-lite</button>
            <button onClick={() => setTool("eraser")}      style={toolBtn(tool === "eraser")}      title="Eraser">🧽 Erase</button>

            <div style={{ display: "flex", gap: 4, marginLeft: 4 }}>
              {PEN_COLORS.map(c => (
                <button key={c} onClick={() => setColor(c)} title={c} style={{
                  width: 28, height: 28, borderRadius: "50%",
                  border: color === c ? "2px solid #fff" : "1px solid rgba(255,255,255,0.2)",
                  background: c, cursor: "pointer", padding: 0,
                }} />
              ))}
            </div>

            <button onClick={undo}  style={toolBtn(false)} title="Undo last stroke">↶ Undo</button>
            <button onClick={clear} style={{ ...toolBtn(false), color: "#ffb4b4" }} title="Clear all">🗑 Clear</button>

            <label style={{
              display: "inline-flex", alignItems: "center", gap: 5, color: "#9ab5cc",
              fontSize: "0.72rem", fontFamily: "monospace", cursor: "pointer",
              padding: "0.4rem 0.6rem", border: "1px solid rgba(255,255,255,0.15)",
              borderRadius: 6, background: penOnly ? "#2a4a8a33" : "transparent",
              minHeight: 38,
            }}>
              <input type="checkbox" checked={penOnly} onChange={e => setPenOnly(e.target.checked)} />
              Pen only
            </label>
          </div>

          {/* Canvas */}
          <div ref={wrapRef} style={{
            flex: 1, background: "#fff", margin: "0.5rem", borderRadius: 8,
            overflow: "hidden", position: "relative",
            boxShadow: "0 4px 24px rgba(0,0,0,0.5)",
          }}>
            <canvas
              ref={canvasRef}
              className={"pencil-canvas" + (penOnly ? " pen-only" : "")}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={onPointerUp}
              onPointerCancel={onPointerUp}
              onPointerLeave={onPointerUp}
              style={{ display: "block", width: "100%", height: "100%", background: "#fff" }}
            />
            {/* faint hint */}
            {!initialDataUrl && (
              <div style={{
                position: "absolute", top: 12, left: 14, color: "#bbb",
                fontSize: "0.78rem", pointerEvents: "none", fontFamily: "monospace",
              }}>
                ✍️ Write notes here · Apple Pencil pressure-sensitive
              </div>
            )}
          </div>

          <div style={{
            padding: "0.4rem 0.75rem 0.6rem", fontSize: "0.7rem",
            color: "#666", fontFamily: "monospace", textAlign: "center",
          }}>
            Saves automatically · {hasPen ? "Pencil detected" : "Touch / mouse input"}
          </div>
        </div>
      );
    }

    // -------- Sync modal --------
    function SyncModal({ syncCode, setSyncCode, syncStatus, lastSyncAt, onClose }) {
      const [enterCode, setEnterCode] = useState("");
      const [copied, setCopied] = useState(false);

      const generate = () => {
        if (syncCode && !confirm("Replace the current sync code with a new one? Existing remote data under the old code stays intact but this device disconnects from it.")) return;
        const code = generateSyncCode();
        setSyncCode(code);
      };
      const useExisting = () => {
        const trimmed = normaliseSyncCode(enterCode);
        if (!isValidSyncCode(trimmed)) {
          alert("Code looks too short. It should be the 16-character code from your other device (with or without dashes).");
          return;
        }
        if (!confirm("Replace this device's data with whatever is in the cloud under that code? Tip: do this on your second device, not the one with all your existing notes/progress.")) return;
        setSyncCode(trimmed);
        setEnterCode("");
      };
      const disconnect = () => {
        if (!confirm("Stop syncing across devices? Your local data stays here, but changes won't propagate.")) return;
        setSyncCode(null);
      };
      const copy = () => {
        if (!syncCode) return;
        navigator.clipboard?.writeText(syncCode).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        });
      };

      const statusColor = {
        idle:        "#888",
        connecting:  "#E67E22",
        synced:      "#27AE60",
        offline:     "#E67E22",
        error:       "#E74C3C",
        disabled:    "#888",
      }[syncStatus] || "#888";
      const statusLabel = {
        idle:        "Local only",
        connecting:  "Connecting…",
        synced:      "Synced",
        offline:     "Offline (will sync)",
        error:       "Error",
        disabled:    "Sync unavailable",
      }[syncStatus] || syncStatus;

      const lastSyncStr = lastSyncAt ? new Date(lastSyncAt).toLocaleTimeString() : null;

      return (
        <div onClick={onClose} className="pencil-overlay" style={{
          position: "fixed", inset: 0, background: "rgba(8,8,14,0.82)",
          zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center",
          padding: "1rem",
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            background: "#141a2b", border: "1px solid rgba(255,255,255,0.1)",
            borderRadius: 12, padding: "1.4rem", width: "100%", maxWidth: 460,
            maxHeight: "90vh", overflowY: "auto",
            boxShadow: "0 8px 40px rgba(0,0,0,0.6)",
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
              <span style={{ fontSize: "1.4rem" }}>🔄</span>
              <h2 style={{ margin: 0, fontSize: "1.1rem", color: "#fff", flex: 1 }}>Sync across devices</h2>
              <button onClick={onClose} style={{

    // -------- onboarding / landing --------
    function Onboarding({ onCreate, onRestore, onCancel }) {
      const todayStr = localISO();
      const [date, setDate] = useState("");
      const [err, setErr] = useState("");

      }
      const submit = () => {
        if (!date) { setErr("Pick your exam date to continue."); return; }

        onCreate(date);

      return (
        <div style={{

            <button onClick={submit} style={{
              marginTop: 16, width: "100%", padding: "0.8rem", background: "#2a4a8a",
              border: "none", borderRadius: 8, color: "#fff", fontSize: "0.95rem",

            <div style={{
              marginTop: 18, paddingTop: 16, borderTop: "1px solid rgba(255,255,255,0.08)",

                background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.15)",
                color: "#a8b8d0", borderRadius: 8, padding: "0.6rem 1rem", cursor: "pointer",
                fontSize: "0.85rem", fontFamily: "monospace",

              <div style={{ color: "#555", fontSize: "0.72rem", marginTop: 8, lineHeight: 1.5 }}>

    // -------- TODAY VIEW --------
    function TodayView({ hoursPerWeek, statuses, setView, setActiveSpecialty }) {
      const today = new Date();
      const week = getCurrentWeek(today);
      const dow = today.getDay(); // 0 Sun .. 6 Sat
      const isWeekend = dow === 0 || dow === 6;

      // Pre-plan: today is before plan start.
      if (week < 1) {
        const days = Math.ceil((stripTime(PLAN_START) - stripTime(today)) / MS_PER_DAY);
        return (
          <div style={{ padding: "2rem 1.5rem", maxWidth: 900, margin: "0 auto" }}>
            <Card>
              <div style={{ fontSize: "0.7rem", color: "#666", fontFamily: "monospace", letterSpacing: "0.15em" }}>
                PLAN STARTS IN {days} DAYS
              </div>
              <p style={{ marginTop: 8, color: "#c8c4bc" }}>
                The {PLAN_WEEKS}-week plan begins on {PLAN_START.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}. Use this time to set up your Anki deck and Passmedicine subscription.
              </p>
            </Card>
          </div>
        );
      }
      // After exam.
      if (today > EXAM_DATE) {
        return (
          <div style={{ padding: "2rem 1.5rem", maxWidth: 900, margin: "0 auto" }}>
            <Card>
              <div style={{ fontSize: "1.1rem", color: "#E74C3C", fontWeight: 700 }}>Exam complete.</div>
              <p style={{ color: "#c8c4bc" }}>Hopefully it went well. Onward.</p>
            </Card>
          </div>
        );
      }

      const phaseIdx = getCurrentPhaseIndex(week);
      const phase = PHASES[phaseIdx];
      const baseline = phaseBaselineHours(phase);
      const scale = hoursPerWeek / baseline;

      const weekdayHrs = phase.weekdayHrsBase * scale;
      const dayOffHrs = phase.dayOffHrsBase * scale;
      const todayHrs = isWeekend ? dayOffHrs : weekdayHrs;
      const todayQs = Math.round((isWeekend ? phase.qsPerDayOffBase : phase.qsPerWeekdayBase) * scale);

      const dayLabel = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dow];
      const dateStr = today.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

      // Current week's systems (those whose label includes "Wk N" matching this week)
      const weekSystems = phase.systems.filter(s => systemMatchesWeek(s, week));

      // Conditions tracker stats for this phase
      const phaseTrackerIds = [...new Set(phase.systems.map(s => s.trackerId).filter(Boolean))];
      const phaseConds = phaseTrackerIds.flatMap(id => {
        const sp = SPECIALTIES.find(s => s.id === id); return sp ? sp.conditions : [];
      });
      const stats = { green: 0, yellow: 0, red: 0, none: 0 };
      phaseConds.forEach(c => stats[statuses[c.id] || "none"]++);
      const total = phaseConds.length || 1;
      const pctConfident = Math.round((stats.green / total) * 100);

      // Overall tracker stats — EVERY condition across all specialties (matches the Tracker view total)
      const allConds = SPECIALTIES.flatMap(s => s.conditions);
      const overallStats = { green: 0, yellow: 0, red: 0, none: 0 };
      allConds.forEach(c => overallStats[statuses[c.id] || "none"]++);
      const overallTotal = allConds.length || 1;
      const overallPctConfident = Math.round((overallStats.green / overallTotal) * 100);

      return (
        <div style={{ padding: "1.5rem", maxWidth: 1000, margin: "0 auto" }}>
          {/* Day banner */}
          <div style={{
            display: "flex", alignItems: "flex-start", gap: "1rem", flexWrap: "wrap",
            marginBottom: "1.5rem",
          }}>
            <div style={{
              background: `linear-gradient(135deg, ${phase.color}33, ${phase.color}11)`,
              border: `1px solid ${phase.color}66`,
              borderRadius: 10, padding: "1rem 1.4rem", minWidth: 220,
            }}>
              <div style={{
                fontSize: "0.65rem", color: phase.color, letterSpacing: "0.15em",
                textTransform: "uppercase", fontFamily: "monospace",
              }}>{dayLabel} · {isWeekend ? "Day off" : "Post-shift"}</div>
              <div style={{ fontSize: "1.4rem", fontWeight: 700, color: "#fff", marginTop: 4 }}>
                {dateStr}
              </div>
              <div style={{ fontSize: "0.85rem", color: "#a8b8d0", marginTop: 6 }}>
                Week <strong style={{ color: "#fff" }}>{realWeekOf(week)} of {PLAN_WEEKS}</strong> ·
                {" "}Phase {phase.id}: <span style={{ color: phase.color }}>{phase.name}</span>
              </div>
            </div>

            {/* Today's targets */}
            <div style={{ flex: 1, minWidth: 260, display: "flex", gap: "0.8rem", flexWrap: "wrap" }}>
              <Stat label="Today's hours" value={`${todayHrs.toFixed(1)} h`}
                    sub={isWeekend ? "Long block" : "Post-shift"} color={phase.color} />
              <Stat label="Q target" value={`${todayQs}`} sub="Passmed/Pastest" color="#27AE60" />
              <Stat label="Anki" value="Daily" sub="No skip days" color="#9B59B6" />
            </div>
          </div>

          {/* This week's focus */}
          <Card>
            <SectionLabel>This week's focus</SectionLabel>
            {weekSystems.length === 0 ? (
              <p style={{ margin: 0, color: "#888", fontSize: "0.9rem" }}>
                No specific system flagged for week {realWeekOf(week)}. Stick with the phase strategy below.
              </p>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {weekSystems.map((s, i) => {
                  const pc = PRIORITY_COLORS[s.priority];
                  const canOpen = !!s.trackerId;
                  return (
                    <div key={i} style={{
                      background: "rgba(255,255,255,0.03)",
                      borderRadius: 7, padding: "0.7rem 0.9rem",
                      borderLeft: `3px solid ${s.priority === "EXAM" ? "#E74C3C" : s.priority === "HIGH" ? "#E74C3C88" : s.priority === "MED" ? "#E67E2288" : "#27AE6088"}`,
                      display: "flex", alignItems: "center", gap: "0.7rem", flexWrap: "wrap",
                    }}>
                      <span style={{
                        background: pc.bg, color: pc.text,
                        fontSize: "0.62rem", padding: "0.18rem 0.5rem",
                        borderRadius: 3, fontFamily: "monospace", fontWeight: 700,
                      }}>{s.priority === "EXAM" ? "EXAM DAY" : pc.label.toUpperCase()}</span>
                      <span style={{ fontSize: "0.7rem", color: "#666", fontFamily: "monospace" }}>{systemWeeksLabel(s)}</span>

    function systemMatchesWeek(system, weekNum) {
      const m = (system.weeks || "").match(/Wk(?:s)?\s*(\d+)(?:[–-](\d+))?/);
      if (!m) return false;
      const a = +m[1], b = m[2] ? +m[2] : a;
      return weekNum >= a && weekNum <= b;

              <button onClick={() => setActivePhase(Math.min(PHASES.length-1, activePhase + 1))} disabled={activePhase === PHASES.length - 1}
                style={navBtn(activePhase === PHASES.length - 1, phase.color)}>Next phase →</button>

    function fmtRange(a, b) {
      const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      return `${fmt(a)} – ${fmt(b)}`;
    }
    // Real calendar date-range (ISO strings) for a phase, derived from the effective
    // timeline by mapping its plan-steps (weekStart..weekEnd) onto the calendar.
    function phaseDatesISO(phase) {
      const base = stripTime(PLAN_START).getTime();
      const startDay = Math.round((phase.weekStart - 1) * DAYS_PER_STEP);
      const endDay = Math.max(startDay, Math.round(phase.weekEnd * DAYS_PER_STEP) - 1);
      return {
        start: localISO(new Date(base + startDay * MS_PER_DAY)),
        end: localISO(new Date(base + endDay * MS_PER_DAY)),
      };
    }
    // Map a plan-step number (1..22) to a real calendar week (1..PLAN_WEEKS) so the
    // displayed week ranges reflect the actual time until the exam. At exactly 22 weeks
    // this is the identity, so existing plans still read 1-6 / 7-14 / 15-19 / 20-22.
    function realWeekOf(step) {
      return Math.min(PLAN_WEEKS, Math.max(1, Math.round((step - 1) * (PLAN_WEEKS / 22)) + 1));
    }
    function scaledWeekRange(aStep, bStep) {
      const start = realWeekOf(aStep);
      return { start, end: Math.max(start, realWeekOf(bStep)) };
    }
    function phaseWeeksLabel(phase) {
      const { start, end } = scaledWeekRange(phase.weekStart, phase.weekEnd);
      return start === end ? `Week ${start}` : `Weeks ${start}–${end}`;
    }
    function systemWeeksLabel(system) {
      const m = (system.weeks || "").match(/Wk(?:s)?\s*(\d+)(?:[–-](\d+))?/);
      if (!m) return system.weeks || "";
      const { start, end } = scaledWeekRange(+m[1], m[2] ? +m[2] : +m[1]);
      return start === end ? `Wk ${start}` : `Wk ${start}–${end}`;
    }

    function RhythmRow({ icon, label, hours, qs, color, suffix, baseHours, baseQs }) {
      return (
        <div>
          <div style={{ fontSize: "0.72rem", color: "#777", fontFamily: "monospace", marginBottom: 5 }}>
            {icon}  {label}
          </div>
          <div style={{
            background: "rgba(255,255,255,0.03)", borderRadius: 6,
            padding: "0.6rem 0.9rem", borderLeft: `3px solid ${color}`,
            color: "#c8c4bc", fontSize: "0.92rem", lineHeight: 1.6,
          }}>
            <strong style={{ color: "#fff" }}>{hours.toFixed(1)} hrs</strong>
            {" "}<span style={{ color: "#888" }}>(plan: {baseHours}h)</span>
            <span style={{ margin: "0 0.5rem", opacity: 0.4 }}>·</span>
            <strong style={{ color: "#fff" }}>~{qs} Qs</strong>
            {" "}<span style={{ color: "#888" }}>(plan: {baseQs})</span>
            {suffix && <span style={{ color: "#888" }}>{suffix}</span>}
          </div>
        </div>
      );
    }

    // -------- TRACKER VIEW --------

    // Constellation (skill-tree) sub-view — Skyrim-style.
    // Each specialty has a recognisable parametric shape (heart for cardiology,
    // kidney for renal, eye for ophthalmology, etc.). Conditions are stars
    // distributed evenly along the shape's outline, connected by glowing lines.
    // Tap a star to cycle status (none → green → yellow → red → none).

    // Per-specialty parametric closed curves, t ∈ [0, 1) → {x, y} in roughly [-1.3, +1.3].
    const CONSTELLATION_SHAPES = {
      cardiology: (t) => {
        // Classic mathematical heart curve
        const a = t * 2 * Math.PI;
        return {
          x: 16 * Math.pow(Math.sin(a), 3) / 17,
          y: -(13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a)) / 17,
        };
      },
      congenital_cardiac: (t) => {
        // DNA helix / vertical figure-8 — represents the chromosomal/genetic
        const a = t * 2 * Math.PI;
        return { x: 0.55 * Math.sin(2 * a), y: -Math.sin(a) * 1.15 };
      },
      respiratory: (t) => {
        // Bilateral lung lobes — inverted heart so the two upper lobes sit at top
        const a = t * 2 * Math.PI;
        return {
          x: 16 * Math.pow(Math.sin(a), 3) / 16 * 1.05,
          y: (13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a)) / 17 + 0.2,
        };
      },
      gastro: (t) => {
        // Stomach J-curve — asymmetric oval with one concavity (lesser curve)
        const a = t * 2 * Math.PI;
        const r = 1 - 0.35 * Math.exp(-Math.pow((a - Math.PI) / 0.7, 2));
        return { x: r * Math.cos(a) * 0.95 - 0.05, y: r * Math.sin(a) * 1.15 };
      },
      renal: (t) => {
        // Kidney bean — elliptical with a single medial concavity (hilum)
        const a = t * 2 * Math.PI;
        const r = 1 - 0.4 * Math.exp(-Math.pow((a - Math.PI) / 0.6, 2));
        return { x: r * Math.cos(a) * 1.05, y: r * Math.sin(a) * 1.15 };
      },
      endocrinology: (t) => {
        // Thyroid butterfly — horizontal lemniscate of Bernoulli (two-lobed)
        const a = t * 2 * Math.PI;
        const cos = Math.cos(a), sin = Math.sin(a);
        const denom = 1 + sin * sin;
        return { x: (1.4 * cos) / denom, y: (1.4 * sin * cos) / denom * 0.85 };
      },
      neurology: (t) => {
        // Brain — wobbly cloud (suggests gyri)
        const a = t * 2 * Math.PI;
        const r = 1 + 0.18 * Math.sin(a * 5) + 0.1 * Math.sin(a * 3 + 1);
        return { x: r * Math.cos(a) * 1.05, y: r * Math.sin(a) * 0.92 };
      },
      rheumatology: (t) => {
        // Bone / dumbbell — pinched at the diaphysis, bulged at the epiphyses
        const a = t * 2 * Math.PI;
        const cx = Math.cos(a);
        const cy = Math.sin(a);
        const pinch = 1 - 0.55 * (1 - cx * cx);
        return { x: cx * 1.3, y: cy * pinch * 0.85 };
      },
      haematology: (t) => {
        // Blood drop / teardrop — cusp pointing UP
        const a = t * 2 * Math.PI;
        const r = 0.55 + 0.55 * (1 - Math.cos(a));
        return { x: r * Math.sin(a) * 0.55, y: -r * Math.cos(a) * 0.75 + 0.15 };
      },
      infectious: (t) => {
        // Microbe — circle with high-frequency bumps suggesting cilia
        const a = t * 2 * Math.PI;
        const r = 0.95 + 0.16 * Math.sin(a * 9);
        return { x: r * Math.cos(a), y: r * Math.sin(a) };
      },
      pharmacology: (t) => {
        // Pill capsule — tilted stretched ellipse
        const a = t * 2 * Math.PI;
        const u = Math.cos(a) * 1.35;
        const v = Math.sin(a) * 0.55;
        const ang = Math.PI / 6;
        return {
          x: u * Math.cos(ang) - v * Math.sin(ang),
          y: u * Math.sin(ang) + v * Math.cos(ang),
        };
      },
      dermatology: (t) => {
        // Skin patch — superellipse (rounded square)
        const a = t * 2 * Math.PI;
        const p = 4;
        const x = Math.sign(Math.cos(a)) * Math.pow(Math.abs(Math.cos(a)), 2 / p);
        const y = Math.sign(Math.sin(a)) * Math.pow(Math.abs(Math.sin(a)), 2 / p);
        return { x: x * 1.15, y: y * 1.1 };
      },
      psychiatry: (t) => {
        // Head silhouette — vertical oval with subtle taper (forehead wider than chin)
        const a = t * 2 * Math.PI;
        const taper = 1 - 0.12 * Math.cos(a);
        return { x: Math.sin(a) * 0.85 * taper, y: -Math.cos(a) * 1.1 };
      },
      ophthalmology: (t) => {
        // Eye almond — flat horizontal lens shape with pointed corners
        const a = t * 2 * Math.PI;
        const x = Math.cos(a) * 1.3;
        const y = Math.sin(a) * 0.5 * Math.pow(Math.abs(Math.sin(a)), 0.25);
        return { x, y };
      },
      oncology: (t) => {
        // Awareness ribbon — vertical lemniscate (figure-8 standing up)
        const a = t * 2 * Math.PI;
        const cos = Math.cos(a), sin = Math.sin(a);
        const denom = 1 + cos * cos;
        return { x: (1.3 * sin * cos) / denom * 0.9, y: (1.3 * sin) / denom * 1.25 };
      },
    };
    const DEFAULT_CONSTELLATION_SHAPE = (t) => {
      const a = t * 2 * Math.PI;
      return { x: Math.cos(a), y: Math.sin(a) };
    };

    // Build a 5-pointed star SVG path centred at (cx, cy)
    function fivePointStarPath(cx, cy, outerR) {
      const innerR = outerR * 0.42;
      let path = "";
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = -Math.PI / 2 + (i * Math.PI / 5);
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        path += (i === 0 ? "M " : " L ") + x.toFixed(1) + " " + y.toFixed(1);
      }
      return path + " Z";
    }

    function ConstellationView({ specialty, statuses, setStatus, statusChangedAt, setHoverId, hoverId }) {
      const conditions = specialty.conditions;
      const N = conditions.length;
      const shape = CONSTELLATION_SHAPES[specialty.id] || DEFAULT_CONSTELLATION_SHAPE;

      // Fixed square viewBox — the SVG scales to fill its container width.
      const VB = 1000;
      const CENTER = VB / 2;
      const SCALE = VB * 0.38;
      // Star size shrinks gently as N grows so labels stay readable on dense specialties.
      const STAR_R = N <= 10 ? 38 : N <= 20 ? 32 : 28;
      const LABEL_FS = N <= 10 ? 24 : N <= 20 ? 21 : 19;

      // ---- Zoom & pan state ----
      const [zoom, setZoom] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const svgRef = useRef(null);
      const gestureRef = useRef({
        pointers: new Map(),
        initialDist: null,
        initialZoom: 1,
        moved: false,
      });
      // Reset zoom/pan when switching specialty
      useEffect(() => { setZoom(1); setPan({ x: 0, y: 0 }); }, [specialty.id]);

      const ZOOM_MIN = 0.5, ZOOM_MAX = 4;
      const clampZoom = (v) => Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, v));
      const adjustZoom = (factor) => setZoom(z => clampZoom(z * factor));
      const resetView = () => { setZoom(1); setPan({ x: 0, y: 0 }); };

      // Dynamic viewBox = a window of the underlying 1000x1000 space, scaled by zoom and offset by pan.
      const halfSide = (VB / 2) / zoom;
      const vbCx = CENTER + pan.x;
      const vbCy = CENTER + pan.y;
      const viewBoxStr = `${(vbCx - halfSide).toFixed(1)} ${(vbCy - halfSide).toFixed(1)} ${(halfSide * 2).toFixed(1)} ${(halfSide * 2).toFixed(1)}`;

      // Sample N evenly-spaced points along the shape outline
      const positions = [];
      for (let i = 0; i < N; i++) {
        const t = i / N;
        const { x, y } = shape(t);
        positions.push({
          condition: conditions[i],
          t,
          x: CENTER + x * SCALE,
          y: CENTER + y * SCALE,
        });
      }

      // Higher-resolution outline path for the faint silhouette
      const OUT_SAMPLES = 240;
      let outlinePath = "";
      for (let i = 0; i <= OUT_SAMPLES; i++) {
        const t = (i % OUT_SAMPLES) / OUT_SAMPLES;
        const { x, y } = shape(t);
        const sx = (CENTER + x * SCALE).toFixed(1);
        const sy = (CENTER + y * SCALE).toFixed(1);
        outlinePath += (i === 0 ? "M " : " L ") + sx + " " + sy;
      }
      outlinePath += " Z";

      // Bright Skyrim-style connecting line through the stars in order
      let constellationPath = "";
      positions.forEach((p, i) => {
        constellationPath += (i === 0 ? "M " : " L ") + p.x.toFixed(1) + " " + p.y.toFixed(1);
      });
      constellationPath += " Z";

      // Stats
      const stats = { green: 0, yellow: 0, red: 0, none: 0 };
      conditions.forEach(c => stats[statuses[c.id] || "none"]++);
      const rated = N - stats.none;
      const pct = N ? Math.round((rated / N) * 100) : 0;

      const cycleStatus = (cid) => {
        const order = ["none", "green", "yellow", "red"];
        const cur = statuses[cid] || "none";
        setStatus(cid, order[(order.indexOf(cur) + 1) % order.length]);
      };

      // Skyrim-tinted palette (gold/amber/ember/dim) — preserves green/yellow/red meaning
      const starPalette = {
        green:  { fill: "#bff5cb", stroke: "#22c55e", glow: "#86efac" },
        yellow: { fill: "#fde68a", stroke: "#eab308", glow: "#fcd34d" },
        red:    { fill: "#fecaca", stroke: "#dc2626", glow: "#f87171" },
        none:   { fill: "#1a2440", stroke: "#5a7090", glow: "#5a7090" },
      };

      const truncate = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

      return (
        <div style={{
          position: "relative",
          background: "radial-gradient(ellipse at center, #1a1a3e 0%, #050818 70%, #000 100%)",
          borderRadius: 12, padding: "0.7rem",
          boxShadow: "inset 0 0 100px rgba(74, 138, 220, 0.12)",
          maxWidth: 760, margin: "0 auto",
        }}>
          <svg ref={svgRef} viewBox={viewBoxStr} style={{
            width: "100%", height: "auto", display: "block",
            touchAction: "none",
            cursor: zoom > 1.05 ? "grab" : "default",
            userSelect: "none",
          }}
            onPointerDown={(e) => {
              const g = gestureRef.current;
              try { e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); } catch (_) {}
              g.pointers.set(e.pointerId, {
                x: e.clientX, y: e.clientY,
                startX: e.clientX, startY: e.clientY,
              });
              g.moved = false;
              if (g.pointers.size === 2) {
                const ps = Array.from(g.pointers.values());
                g.initialDist = Math.hypot(ps[1].x - ps[0].x, ps[1].y - ps[0].y);
                g.initialZoom = zoom;
              }
            }}
            onPointerMove={(e) => {
              const g = gestureRef.current;
              const prev = g.pointers.get(e.pointerId);
              if (!prev) return;
              g.pointers.set(e.pointerId, { ...prev, x: e.clientX, y: e.clientY });
              const totalDx = e.clientX - prev.startX;
              const totalDy = e.clientY - prev.startY;
              if (Math.hypot(totalDx, totalDy) > 6) g.moved = true;

              if (g.pointers.size === 2 && g.initialDist) {
                // Pinch zoom
                const ps = Array.from(g.pointers.values());
                const d = Math.hypot(ps[1].x - ps[0].x, ps[1].y - ps[0].y);
                setZoom(clampZoom(g.initialZoom * (d / g.initialDist)));
              } else if (g.pointers.size === 1 && zoom > 1.02) {
                // One-finger pan (only when zoomed in)
                const rect = svgRef.current && svgRef.current.getBoundingClientRect();
                if (!rect) return;
                const pxToVB = (VB / zoom) / rect.width;
                const dx = (e.clientX - prev.x) * pxToVB;
                const dy = (e.clientY - prev.y) * pxToVB;
                setPan(p => ({ x: p.x - dx, y: p.y - dy }));
              }
            }}
            onPointerUp={(e) => {
              gestureRef.current.pointers.delete(e.pointerId);
              if (gestureRef.current.pointers.size < 2) gestureRef.current.initialDist = null;
            }}
            onPointerCancel={(e) => {
              gestureRef.current.pointers.delete(e.pointerId);
              if (gestureRef.current.pointers.size < 2) gestureRef.current.initialDist = null;
            }}
            onWheel={(e) => {
              // Mouse-wheel / trackpad zoom (desktop)
              e.preventDefault();
              const factor = e.deltaY > 0 ? 1 / 1.18 : 1.18;
              setZoom(z => clampZoom(z * factor));
            }}>
            <defs>
              <radialGradient id="cg-bg-glow" cx="50%" cy="50%">
                <stop offset="0%" stopColor="#4a8adc" stopOpacity={0.28} />
                <stop offset="55%" stopColor="#1a2a5a" stopOpacity={0.12} />
                <stop offset="100%" stopColor="#000" stopOpacity={0} />
              </radialGradient>
              <filter id="cg-star-glow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <filter id="cg-line-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            {/* Background starfield - deterministic seeded scatter */}
            {Array.from({ length: 90 }).map((_, i) => {
              const seed = i * 7919;
              const bx = (seed % VB);
              const by = ((seed * 13) % VB);
              const br = ((seed * 7) % 100) > 92 ? 2.6 : 1.4;
              const op = 0.15 + ((seed % 60) / 200);
              return <circle key={`bg-${i}`} cx={bx} cy={by} r={br} fill="#cfdcec" opacity={op} />;
            })}

            {/* Soft centre glow */}
            <circle cx={CENTER} cy={CENTER} r={SCALE * 1.3} fill="url(#cg-bg-glow)" />

            {/* Faint shape silhouette - hints at the recognisable outline */}
            <path d={outlinePath} fill="none"
              stroke="#2a4a8a" strokeWidth={2} strokeDasharray="3 7" opacity={0.45} />

            {/* Bright Skyrim-style connecting line through consecutive stars */}
            <path d={constellationPath} fill="none"
              stroke="#8ab8e8" strokeWidth={3.5} opacity={0.65}
              filter="url(#cg-line-glow)" />

            {/* Stars */}
            {positions.map(pos => {
              const cid = pos.condition.id;
              const status = statuses[cid] || "none";
              const p = starPalette[status];
              const isHovered = hoverId === cid;
              const r = status !== "none" ? STAR_R * 1.05 : STAR_R * 0.85;

              // ---- Radial label placement ----
              // Push label outward from the centre along this star's angle.
              const dxC = pos.x - CENTER;
              const dyC = pos.y - CENTER;
              const distC = Math.hypot(dxC, dyC);
              // For stars too near the centre (e.g. figure-8 crossover), default to downward
              const useFallback = distC < SCALE * 0.12;
              const lcos = useFallback ? 0 : dxC / distC;
              const lsin = useFallback ? 1 : dyC / distC;
              const offset = r + LABEL_FS * 0.55;
              const labelX = pos.x + lcos * offset;
              const labelY = pos.y + lsin * offset;
              const textAnchor = lcos > 0.4 ? "start" : lcos < -0.4 ? "end" : "middle";
              const dominantBaseline = lsin > 0.4 ? "hanging" : lsin < -0.4 ? "auto" : "central";

              return (
                <g key={cid} style={{ cursor: "pointer" }}
                  onClick={(e) => {
                    if (gestureRef.current.moved) {
                      gestureRef.current.moved = false;
                      return;
                    }
                    cycleStatus(cid);
                    setHoverId(cid);
                  }}
                  onMouseEnter={() => setHoverId(cid)}
                  onMouseLeave={() => setHoverId(null)}>
                  {/* Halo for rated stars */}
                  {status !== "none" && (
                    <circle cx={pos.x} cy={pos.y} r={r * 1.9}
                      fill={p.glow} opacity={isHovered ? 0.45 : 0.28} />
                  )}
                  {/* The 5-pointed star */}
                  <path d={fivePointStarPath(pos.x, pos.y, r)}
                    fill={p.fill} stroke={p.stroke} strokeWidth={3}
                    filter={status !== "none" ? "url(#cg-star-glow)" : null} />
                  {/* Generous invisible tap target */}
                  <circle cx={pos.x} cy={pos.y} r={r * 1.9} fill="transparent" />
                  {/* Radial label */}
                  <text x={labelX} y={labelY}
                    textAnchor={textAnchor} dominantBaseline={dominantBaseline}
                    fontSize={LABEL_FS} fill={status !== "none" ? "#e6edf5" : "#8aa0c0"}
                    fontFamily="'Avenir Next', 'Segoe UI', system-ui, sans-serif"
                    fontWeight={status !== "none" ? 600 : 400}
                    style={{ pointerEvents: "none" }}>
                    {truncate(pos.condition.name, 18)}
                  </text>
                </g>
              );
            })}
          </svg>

          {/* Floating header — specialty + percent + stats */}
          <div style={{
            position: "absolute", top: 14, left: 14, right: 14,
            display: "flex", justifyContent: "space-between", alignItems: "flex-start",
            pointerEvents: "none", gap: "0.5rem", flexWrap: "wrap",
          }}>
            <div style={{
              background: "rgba(10, 10, 24, 0.85)",
              border: "1px solid #4a8adc", borderRadius: 6,
              padding: "0.45rem 0.75rem", fontSize: "0.78rem",
              color: "#cfdcec", fontFamily: "monospace",
              backdropFilter: "blur(4px)",
              display: "flex", alignItems: "center", gap: 8,
            }}>
              <span style={{ fontSize: "1.05rem" }}>{specialty.icon}</span>
              <span style={{ fontWeight: 700 }}>{specialty.name}</span>
              <span style={{ color: "#7aa8e8", fontWeight: 700 }}>· {pct}%</span>
              <span style={{ color: "#7a90b0" }}>({rated}/{N})</span>
            </div>
            <div style={{
              background: "rgba(10, 10, 24, 0.85)",
              border: "1px solid #4a8adc", borderRadius: 6,
              padding: "0.45rem 0.75rem", fontSize: "0.72rem",
              color: "#cfdcec", fontFamily: "monospace",
              backdropFilter: "blur(4px)",
              display: "flex", gap: "0.8rem", alignItems: "center",
            }}>
              {["green", "yellow", "red"].map(s => (
                <span key={s} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%",
                    background: STATUS_CONFIG[s].color,
                    boxShadow: `0 0 6px ${STATUS_CONFIG[s].color}` }} />
                  <span>{stats[s]}</span>
                </span>
              ))}
            </div>
          </div>

          {/* Zoom controls (bottom-right) */}
          <div style={{
            position: "absolute", bottom: 14, right: 14,
            display: "flex", flexDirection: "column", gap: 6,
            background: "rgba(10, 10, 24, 0.85)",
            border: "1px solid #4a8adc", borderRadius: 8,
            padding: 4, backdropFilter: "blur(4px)",
          }}>
            {[
              { label: "+", onClick: () => adjustZoom(1.4), title: "Zoom in" },
              { label: "−", onClick: () => adjustZoom(1 / 1.4), title: "Zoom out" },
              { label: "⟲", onClick: resetView, title: "Reset" },
            ].map((b, i) => (
              <button key={i} onClick={b.onClick} title={b.title} style={{
                width: 34, height: 34, borderRadius: 6,
                border: "1px solid #4a8adc",
                background: "rgba(74, 138, 220, 0.18)",
                color: "#cfdcec", fontFamily: "monospace",
                fontSize: "1.05rem", fontWeight: 700, cursor: "pointer",
                lineHeight: 1, padding: 0,
              }}>{b.label}</button>
            ))}
            <div style={{
              fontSize: "0.6rem", color: "#7a90b0", fontFamily: "monospace",
              textAlign: "center", padding: "2px 0",
            }}>{Math.round(zoom * 100)}%</div>
          </div>

          {/* Hovered condition detail card */}
          {hoverId && (() => {
            const c = conditions.find(x => x.id === hoverId);
            if (!c) return null;
            const status = statuses[c.id] || "none";
            const sc = STATUS_CONFIG[status];
            return (
              <div style={{
                position: "absolute", bottom: 14, left: 14, right: 64,
                background: "rgba(10, 10, 24, 0.92)",
                border: `1px solid ${status === "none" ? "#4a6a8a" : sc.color}`,
                borderRadius: 8, padding: "0.6rem 0.85rem",
                color: "#e6edf5", fontFamily: "'Avenir Next', 'Segoe UI', system-ui, sans-serif",
                fontSize: "0.88rem", lineHeight: 1.4,
                backdropFilter: "blur(6px)",
                pointerEvents: "none",
              }}>
                <div style={{ fontWeight: 700, marginBottom: 2 }}>{c.name}</div>
                {status !== "none" && statusChangedAt[c.id] && (
                  <div style={{ fontSize: "0.72rem", color: sc.color, fontFamily: "monospace" }}>
                    {sc.label} · {fmtDaysShort(statusChangedAt[c.id])}
                  </div>
                )}
                <div style={{ fontSize: "0.68rem", color: "#7a90b0", marginTop: 3 }}>
                  Tap to cycle status
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    function TrackerView({ statuses, setStatus, statusChangedAt, activeSpecialty, setActiveSpecialty, notes, setNote }) {
      const [search, setSearch] = useState("");
      const [filterStatus, setFilterStatus] = useState("all");
      const [expandedId, setExpandedId] = useState(null);
      const [noteEditId, setNoteEditId] = useState(null);
      const [viewMode, setViewModeState] = useState(() => {
        try { return localStorage.getItem("msra_tracker_mode") || "list"; } catch (e) { return "list"; }
      });
      const [hoverId, setHoverId] = useState(null);
      const setViewMode = (m) => {
        setViewModeState(m);
        try { localStorage.setItem("msra_tracker_mode", m); } catch (e) {}
      };

      const currentSpecialty = SPECIALTIES.find(s => s.id === activeSpecialty) || SPECIALTIES[0];

      const filtered = currentSpecialty.conditions.filter(c => {
        const haystack = (
          (c.keyFacts || "") + " " +
          (c.epidemiology || "") + " " +
          (c.aetiology || "") + " " +
          (c.pathophysiology || "") + " " +
          (c.presentation || "") + " " +
          (c.investigations || "") + " " +
          (c.treatment || "") + " " +
          (c.fields ? c.fields.map(f => f.value).join(" ") : "")
        ).toLowerCase();
        const matchSearch = !search ||
          c.name.toLowerCase().includes(search.toLowerCase()) ||
          haystack.includes(search.toLowerCase());
        const matchFilter = filterStatus === "all" || (statuses[c.id] || "none") === filterStatus;
        return matchSearch && matchFilter;
      });

      const getStats = sp => {
        const counts = { green: 0, yellow: 0, red: 0, none: 0 };
        sp.conditions.forEach(c => counts[statuses[c.id] || "none"]++);
        return counts;
      };

      const totalStats = { green: 0, yellow: 0, red: 0, none: 0 };
      SPECIALTIES.forEach(s => {
        const stats = getStats(s);
        for (const k of Object.keys(totalStats)) totalStats[k] += stats[k];
      });
      const totalConds = Object.values(totalStats).reduce((a, b) => a + b, 0) || 1;

      return (
        <div style={{ background: "#f8f7f4", color: "#1a1a1a", minHeight: "calc(100vh - 200px)" }}>
          {/* Tracker subheader (light) */}
          <div style={{ background: "#141a2b", padding: "1rem 1.5rem", borderBottom: "3px solid #2a4a8a" }}>
            <div style={{ maxWidth: 1100, margin: "0 auto" }}>
              <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: "1rem" }}>
                <div style={{ fontSize: "0.95rem", color: "#fff", fontWeight: 700 }}>Condition Tracker</div>
                <div style={{ fontSize: "0.78rem", color: "#7a9abf", fontFamily: "monospace" }}>
                  {totalConds} conditions · {SPECIALTIES.length} specialties
                </div>
                {["green","yellow","red"].map(s => (
                  <span key={s} style={{ fontSize: "0.78rem", color: "#9ab5cc", display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: STATUS_CONFIG[s].color }} />
                    {STATUS_CONFIG[s].label}: {totalStats[s]}
                  </span>
                ))}
              </div>
              <div style={{ marginTop: 8, height: 5, background: "#0f0f20", borderRadius: 3, overflow: "hidden", display: "flex" }}>
                {["green","yellow","red"].map(s => (
                  <div key={s} style={{ width: `${(totalStats[s]/totalConds)*100}%`, background: STATUS_CONFIG[s].color, transition: "width .4s" }} />
                ))}
              </div>
            </div>
          </div>

          {/* Mobile: horizontal specialty strip (sidebar hidden under 720px) */}
          <div className="tracker-strip specialty-strip" style={{
            display: "none", overflowX: "auto", gap: 6,
            padding: "0.55rem 0.75rem",
            background: "#1e1e30", borderBottom: "1px solid #2a2a45",
          }}>
            {SPECIALTIES.map(s => {
              const stats = getStats(s);
              const total = s.conditions.length;
              const isActive = activeSpecialty === s.id;
              return (
                <button key={s.id}
                  onClick={() => { setActiveSpecialty(s.id); setExpandedId(null); setSearch(""); }}
                  style={{
                    flex: "0 0 auto",
                    background: isActive ? "#2a4a8a" : "rgba(255,255,255,0.04)",
                    border: `1px solid ${isActive ? "#4a8adc" : "rgba(255,255,255,0.08)"}`,
                    color: isActive ? "#fff" : "#9ab5cc",
                    borderRadius: 18, padding: "0.4rem 0.8rem",
                    fontSize: "0.78rem", whiteSpace: "nowrap",
                    display: "inline-flex", alignItems: "center", gap: 6, cursor: "pointer",
                  }}>
                  <span>{s.icon}</span>
                  <span style={{ fontWeight: isActive ? 600 : 400 }}>{s.name}</span>
                  <span style={{
                    fontSize: "0.65rem", fontFamily: "monospace",
                    color: isActive ? "#cfdcec" : "#6b8aa6",
                  }}>{total - stats.none}/{total}</span>
                </button>
              );
            })}
          </div>

          <div style={{ display: "flex", maxWidth: 1200, margin: "0 auto" }}>
            {/* Sidebar (hidden on small screens) */}
            <div className="tracker-sidebar" style={{
              flexShrink: 0, background: "#1e1e30",
              minHeight: "calc(100vh - 220px)", borderRight: "1px solid #2a2a45",
              padding: "0.5rem 0",
            }}>
              {SPECIALTIES.map(s => {
                const stats = getStats(s);
                const total = s.conditions.length;
                const rated = total - stats.none;
                const isActive = activeSpecialty === s.id;
                return (
                  <button key={s.id} onClick={() => { setActiveSpecialty(s.id); setExpandedId(null); setSearch(""); }}
                    style={{
                      width: "100%", background: isActive ? "#2a4a8a" : "none",
                      border: "none", textAlign: "left", padding: "0.55rem 0.85rem", cursor: "pointer",
                      borderLeft: isActive ? "3px solid #4a8adc" : "3px solid transparent",
                      color: "#fff",
                    }}>
                    <div style={{ display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: 3 }}>
                      <span style={{ fontSize: "0.85rem" }}>{s.icon}</span>
                      <span style={{ fontSize: "0.76rem", fontWeight: isActive ? 600 : 400,
                        color: isActive ? "#fff" : "#9ab5cc", lineHeight: 1.3 }}>{s.name}</span>
                    </div>
                    <div style={{ display: "flex", gap: 2, marginLeft: "1.35rem", alignItems: "center" }}>
                      {["green","yellow","red"].map(st => stats[st] > 0 && (
                        <span key={st} style={{
                          width: `${(stats[st]/total)*48}px`, minWidth: 4, height: 3,
                          background: STATUS_CONFIG[st].color, borderRadius: 2,
                        }} />
                      ))}
                      {rated < total && (
                        <span style={{ fontSize: "0.6rem", color: "#4a6a8a", marginLeft: 3 }}>{rated}/{total}</span>
                      )}
                    </div>
                  </button>
                );
              })}
            </div>

            {/* Main */}
            <div style={{ flex: 1, padding: "1.1rem", overflowX: "hidden",
                          fontFamily: "'Avenir Next','Segoe UI',system-ui,sans-serif" }}>
              {/* Controls */}
              <div style={{ display: "flex", gap: "0.7rem", flexWrap: "wrap", alignItems: "center", marginBottom: "0.9rem" }}>
                {/* View mode toggle (List / Constellation) */}
                <div style={{
                  display: "inline-flex", background: "#141a2b", borderRadius: 6,
                  padding: 3, border: "1px solid #2a4a8a",
                }}>
                  {[
                    { id: "list", label: "📋 List" },
                    { id: "constellation", label: "✦ Constellation" },
                  ].map(m => (
                    <button key={m.id} onClick={() => setViewMode(m.id)} style={{
                      padding: "0.32rem 0.7rem", borderRadius: 4, cursor: "pointer",
                      fontSize: "0.72rem", fontFamily: "monospace", fontWeight: 600,
                      background: viewMode === m.id ? "#2a4a8a" : "transparent",
                      color: viewMode === m.id ? "#fff" : "#9ab5cc",
                      border: "none",
                    }}>{m.label}</button>
                  ))}
                </div>
                {viewMode === "list" && (
                  <React.Fragment>
                    <div style={{
                      display: "flex", alignItems: "center", gap: 6,
                      background: "#fff", border: "1px solid #d0d0c0", borderRadius: 6,
                      padding: "0.35rem 0.7rem", flex: 1, maxWidth: 320,
                    }}>
                      <span style={{ color: "#888", fontSize: "0.85rem" }}>🔍</span>
                      <input value={search} onChange={e => setSearch(e.target.value)}
                        placeholder={`Search ${currentSpecialty.itemNoun || "conditions"}...`} style={{
                        border: "none", outline: "none", fontSize: "0.85rem",
                        background: "transparent", width: "100%", color: "#1a1a1a", fontFamily: "inherit",
                      }} />
                    </div>
                    <div style={{ display: "flex", gap: 4 }}>
                      {["all","none","green","yellow","red"].map(f => (
                        <button key={f} onClick={() => setFilterStatus(f)} style={{
                          padding: "0.3rem 0.65rem", borderRadius: 5, cursor: "pointer",
                          fontSize: "0.72rem", fontFamily: "monospace",
                          background: filterStatus === f ? (f === "all" || f === "none" ? "#141a2b" : STATUS_CONFIG[f].bg) : "#fff",
                          color: filterStatus === f ? (f === "all" || f === "none" ? "#fff" : STATUS_CONFIG[f].color) : "#666",
                          border: `1px solid ${filterStatus === f ? (f === "all" || f === "none" ? "#141a2b" : STATUS_CONFIG[f].border) : "#d0d0c0"}`,
                          fontWeight: filterStatus === f ? 600 : 400,
                        }}>
                          {f === "all" ? "All" : f === "none" ? "Unrated" : STATUS_CONFIG[f].label}
                        </button>
                      ))}
                    </div>
                  </React.Fragment>
                )}
              </div>

              {/* Specialty header */}
              <div style={{ marginBottom: "0.7rem", display: "flex", alignItems: "baseline", gap: "0.7rem" }}>
                <span style={{ fontSize: "1.3rem" }}>{currentSpecialty.icon}</span>
                <h2 style={{ margin: 0, fontSize: "1.18rem", fontWeight: 700, color: "#141a2b" }}>{currentSpecialty.name}</h2>
                <span style={{ fontSize: "0.78rem", color: "#888", fontFamily: "monospace" }}>{filtered.length} {currentSpecialty.itemNoun || "conditions"}</span>
              </div>

              {/* Conditions */}
              {viewMode === "constellation" && (

    // Tiny markdown-lite renderer.
    // Supports: ## h3, ### h4, - bullets, **bold**, *italic*, `code`,
    // | tables, --- horizontal rule, > blockquote, paragraphs.
    function renderInline(text) {
      // Split on **, *, ` while preserving them; then rebuild as React nodes.
      const parts = [];
      let buf = "";
      let i = 0;
      const flush = () => { if (buf) { parts.push(buf); buf = ""; } };
      while (i < text.length) {
        if (text.startsWith("**", i)) {
          const end = text.indexOf("**", i + 2);
          if (end > -1) { flush(); parts.push(<strong key={parts.length}>{text.slice(i + 2, end)}</strong>); i = end + 2; continue; }
        }
        if (text[i] === "*") {
          const end = text.indexOf("*", i + 1);
          if (end > -1) { flush(); parts.push(<em key={parts.length}>{text.slice(i + 1, end)}</em>); i = end + 1; continue; }
        }
        if (text[i] === "`") {
          const end = text.indexOf("`", i + 1);
          if (end > -1) { flush(); parts.push(
            <code key={parts.length} style={{ background: "rgba(255,255,255,0.06)", padding: "0.1rem 0.35rem", borderRadius: 3, fontSize: "0.88em" }}>
              {text.slice(i + 1, end)}
            </code>); i = end + 1; continue; }
        }
        buf += text[i]; i++;
      }
      flush();
      return parts;
    }

    function MarkdownLite({ content }) {
      const lines = (content || "").split("\n");
      const blocks = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        // headings
        if (line.startsWith("### ")) { blocks.push({ kind: "h4", text: line.slice(4) }); i++; continue; }
        if (line.startsWith("## "))  { blocks.push({ kind: "h3", text: line.slice(3) }); i++; continue; }
        // hr
        if (line.trim() === "---")   { blocks.push({ kind: "hr" }); i++; continue; }
        // blockquote
        if (line.startsWith("> "))   { blocks.push({ kind: "quote", text: line.slice(2) }); i++; continue; }
        // table (collect contiguous | lines)
        if (line.trim().startsWith("|")) {
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim()));
            i++;
          }
          // detect separator row (all dashes)
          const sepIdx = rows.findIndex(r => r.every(c => /^[-: ]+$/.test(c)));
          let header = null, body = rows;
          if (sepIdx > 0) { header = rows.slice(0, sepIdx); body = rows.slice(sepIdx + 1); }
          blocks.push({ kind: "table", header, body });
          continue;
        }
        // bullets
        if (line.startsWith("- ") || line.startsWith("* ")) {
          const items = [];
          while (i < lines.length && (lines[i].startsWith("- ") || lines[i].startsWith("* "))) {
            items.push(lines[i].slice(2));
            i++;
          }
          blocks.push({ kind: "list", items });
          continue;
        }
        // blank line
        if (!line.trim()) { i++; continue; }
        // paragraph (collect contiguous non-blank, non-special lines)
        const paraLines = [line];
        i++;
        while (i < lines.length && lines[i].trim() &&
               !lines[i].startsWith("#") && !lines[i].startsWith("- ") &&
               !lines[i].startsWith("* ") && !lines[i].startsWith("> ") &&
               !lines[i].trim().startsWith("|") && lines[i].trim() !== "---") {
          paraLines.push(lines[i]); i++;
        }
        blocks.push({ kind: "p", text: paraLines.join(" ") });
      }

      return (
        <div style={{ fontSize: "0.92rem", lineHeight: 1.65, color: "#d8d4cc" }}>
          {blocks.map((b, idx) => {
            if (b.kind === "h3") return (
              <h3 key={idx} style={{ fontSize: "1.05rem", fontWeight: 700, color: "#fff",
                                      margin: "1.2rem 0 0.5rem", borderBottom: "1px solid rgba(255,255,255,0.08)", paddingBottom: 4 }}>
                {renderInline(b.text)}
              </h3>
            );
            if (b.kind === "h4") return (
              <h4 key={idx} style={{ fontSize: "0.92rem", fontWeight: 700, color: "#a8b8d0",
                                      margin: "0.9rem 0 0.4rem" }}>
                {renderInline(b.text)}
              </h4>
            );
            if (b.kind === "hr") return <hr key={idx} style={{ border: "none", borderTop: "1px solid rgba(255,255,255,0.1)", margin: "1rem 0" }} />;
            if (b.kind === "quote") return (
              <blockquote key={idx} style={{
                margin: "0.8rem 0", padding: "0.5rem 0.9rem", borderLeft: "3px solid #2dd4bf",
                background: "rgba(74,144,217,0.06)", color: "#c8d4e0", borderRadius: "0 6px 6px 0",
                fontSize: "0.88rem",
              }}>{renderInline(b.text)}</blockquote>
            );
            if (b.kind === "list") return (
              <ul key={idx} style={{ margin: "0.4rem 0 0.8rem", paddingLeft: "1.2rem" }}>
                {b.items.map((it, j) => <li key={j} style={{ marginBottom: 4 }}>{renderInline(it)}</li>)}
              </ul>
            );
            if (b.kind === "table") return (
              <div key={idx} style={{ overflowX: "auto", margin: "0.6rem 0 0.9rem" }}>
                <table style={{ borderCollapse: "collapse", fontSize: "0.85rem", width: "100%" }}>
                  {b.header && (
                    <thead>
                      {b.header.map((row, ri) => (
                        <tr key={ri}>{row.map((c, ci) => (
                          <th key={ci} style={{
                            padding: "0.4rem 0.6rem",
                            background: "rgba(255,255,255,0.05)",
                            color: "#fff", textAlign: "left",
                            border: "1px solid rgba(255,255,255,0.08)",
                          }}>{renderInline(c)}</th>
                        ))}</tr>
                      ))}
                    </thead>
                  )}
                  <tbody>
                    {b.body.map((row, ri) => (
                      <tr key={ri}>{row.map((c, ci) => (
                        <td key={ci} style={{
                          padding: "0.4rem 0.6rem",
                          border: "1px solid rgba(255,255,255,0.08)",
                          color: "#c8c4bc", verticalAlign: "top",
                        }}>{renderInline(c)}</td>
                      ))}</tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
            return (
              <p key={idx} style={{ margin: "0.5rem 0", color: "#c8c4bc" }}>{renderInline(b.text)}</p>
            );
          })}
        </div>
      );
    }

    function NotebookView({ activeNotebookSectionId, setActiveNotebookSectionId,
                            activeTopicId, setActiveTopicId,
                            bookmarks, toggleBookmark }) {
      const [search, setSearch] = useState("");
      const [showOnlyBookmarks, setShowOnlyBookmarks] = useState(false);

      const sections = NOTEBOOK.sections || [];
      const currentSection = sections.find(s => s.id === activeNotebookSectionId) || sections[0];

      // If searching, show flat results across all sections
      const searchActive = !!search.trim() || showOnlyBookmarks;
      const allTopics = sections.flatMap(s => s.topics.map(t => ({ ...t, sectionId: s.id, sectionName: s.name, sectionIcon: s.icon })));
      const filteredAll = allTopics.filter(t => {
        const matchSearch = !search.trim() ||
          t.name.toLowerCase().includes(search.toLowerCase()) ||
          (t.content || "").toLowerCase().includes(search.toLowerCase());
        const matchBookmark = !showOnlyBookmarks || bookmarks[t.id];
        return matchSearch && matchBookmark;
      });

      const sectionTopics = currentSection ? currentSection.topics : [];

      const topicsToShow = searchActive
        ? filteredAll
        : sectionTopics.map(t => ({ ...t, sectionId: currentSection?.id, sectionIcon: currentSection?.icon }));

      const activeTopic = activeTopicId
        ? allTopics.find(t => t.id === activeTopicId)

            </div>
            <button onClick={() => setShowOnlyBookmarks(s => !s)} style={{
              background: showOnlyBookmarks ? "#2a4a8a" : "rgba(255,255,255,0.04)",
              border: `1px solid ${showOnlyBookmarks ? "#4a8adc" : "rgba(255,255,255,0.1)"}`,
              color: showOnlyBookmarks ? "#fff" : "#a8b8d0",

            <div className="tracker-sidebar" style={{

            }}>
