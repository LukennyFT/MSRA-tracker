          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: "0.9rem", flexWrap: "wrap" }}>
            <button onClick={onBack} style={{
              background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)",
              color: "#a8b8d0", padding: "0.35rem 0.7rem", borderRadius: 6,
              cursor: "pointer", fontSize: "0.78rem", fontFamily: "monospace",
            }}>← Topics</button>
            <h2 style={{ margin: 0, fontSize: "1.15rem", color: "#fff", fontWeight: 700, flex: 1, minWidth: 0 }}>
              {topic.name}
            </h2>
            <button onClick={onToggleBookmark} title={isBookmarked ? "Remove bookmark" : "Bookmark"}
              style={{
                background: isBookmarked ? "rgba(255,215,0,0.1)" : "rgba(255,255,255,0.04)",
                border: `1px solid ${isBookmarked ? "rgba(255,215,0,0.4)" : "rgba(255,255,255,0.1)"}`,
                color: isBookmarked ? "#FFD700" : "#a8b8d0",
                padding: "0.35rem 0.7rem", borderRadius: 6,
                cursor: "pointer", fontSize: "0.85rem",
              }}>
              {isBookmarked ? "★ Saved" : "☆ Bookmark"}
            </button>
          </div>
          <MarkdownLite content={topic.content} />
        </div>
      );
    }

    // -------- shared atoms --------
    function Card({ children }) {
      return (
        <div style={{
          background: "#141a2b", border: "1px solid rgba(255,255,255,0.07)",
          borderRadius: 10, padding: "1.4rem", marginBottom: "1.2rem",
        }}>{children}</div>
      );
    }
    function SectionLabel({ children }) {
      return (
        <div style={{
          fontSize: "0.68rem", letterSpacing: "0.15em", color: "#666",
          textTransform: "uppercase", fontFamily: "monospace", marginBottom: "0.9rem",
        }}>{children}</div>
      );
    }
    function Stat({ label, value, sub, color }) {
      return (
        <div style={{
          background: "#141a2b", border: "1px solid rgba(255,255,255,0.07)",
          borderRadius: 8, padding: "0.8rem 1rem", flex: "1 1 130px", minWidth: 130,
        }}>
          <div style={{ fontSize: "0.62rem", letterSpacing: "0.12em", textTransform: "uppercase",
                         color: "#777", fontFamily: "monospace" }}>{label}</div>
          <div style={{ fontSize: "1.4rem", fontWeight: 700, color, marginTop: 4 }}>{value}</div>
          {sub && <div style={{ fontSize: "0.72rem", color: "#888", marginTop: 2 }}>{sub}</div>}
        </div>
      );
    }
    const pillBtn = color => ({
      background: `${color}22`, border: `1px solid ${color}55`, color, fontSize: "0.7rem",
      padding: "0.25rem 0.6rem", borderRadius: 4, cursor: "pointer", fontFamily: "monospace",
    });
    const navBtn = (disabled, color = "#888") => ({
      background: disabled ? "none" : `${color}22`,
      border: `1px solid ${disabled ? "rgba(255,255,255,0.1)" : color + "55"}`,
      color: disabled ? "#333" : color,
      padding: "0.5rem 1.1rem", borderRadius: 5,
      cursor: disabled ? "not-allowed" : "pointer",
      fontSize: "0.78rem", fontFamily: "monospace",
    });

    // -------- QUESTION BANK VIEW --------
    function QBankView({ qbankProgress, setQbankProgress }) {
      const allQuestions = (window.QBANK && window.QBANK.questions) || [];
      const notebookSections = (window.NOTEBOOK && window.NOTEBOOK.sections) || [];

      // Build per-section question counts, joined with notebook metadata for display
      const sectionsMeta = useMemo(() => {
        const map = new Map();
        allQuestions.forEach(q => {
          if (!map.has(q.section)) map.set(q.section, 0);
          map.set(q.section, map.get(q.section) + 1);
        });
        return Array.from(map.entries()).map(([id, count]) => {
          const nb = notebookSections.find(s => s.id === id);
          return { id, count, name: nb ? nb.name : id, icon: nb ? nb.icon : "📚" };
        }).sort((a, b) => a.name.localeCompare(b.name));
      }, [allQuestions, notebookSections]);

      // ---- Mode state ----
      const [mode, setMode] = useState("setup"); // setup | session | results | review

      // ---- Setup state ----
      const [selectedIds, setSelectedIds] = useState(() => new Set(sectionsMeta.map(s => s.id)));
      const [practiceMode, setPracticeMode] = useState("practice"); // practice | mock
      const [numQuestions, setNumQuestions] = useState(10);

      // ---- Session state ----
      const [sessionQuestions, setSessionQuestions] = useState([]);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [sessionAnswers, setSessionAnswers] = useState([]); // index-aligned with sessionQuestions
      const [selectedOption, setSelectedOption] = useState(null);
      const [revealed, setRevealed] = useState(false);

      // Re-init selected set when sections list first becomes available
      useEffect(() => {
        if (sectionsMeta.length && selectedIds.size === 0) {
          setSelectedIds(new Set(sectionsMeta.map(s => s.id)));
        }
      }, [sectionsMeta]);

      const totalAvailable = useMemo(() => {
        return allQuestions.filter(q => selectedIds.has(q.section)).length;
      }, [allQuestions, selectedIds]);

      const toggleSection = (sid) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(sid)) next.delete(sid); else next.add(sid);
          return next;
        });
      };

      const selectAll = () => setSelectedIds(new Set(sectionsMeta.map(s => s.id)));
      const selectNone = () => setSelectedIds(new Set());

      const startSession = () => {
        const pool = allQuestions.filter(q => selectedIds.has(q.section));
        if (pool.length === 0) return;
        // Fisher-Yates shuffle
        const shuffled = pool.slice();
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const wanted = numQuestions === "all" ? shuffled.length : Math.min(numQuestions, shuffled.length);
        const session = shuffled.slice(0, wanted);
        setSessionQuestions(session);
        setSessionAnswers(new Array(session.length).fill(null));
        setCurrentIdx(0);
        setSelectedOption(null);
        setRevealed(false);
        setMode("session");
      };

      const submitAnswer = (idx) => {
        if (revealed && practiceMode === "practice") return;
        setSelectedOption(idx);
        if (practiceMode === "practice") setRevealed(true);
      };

      const recordAndAdvance = () => {
        const q = sessionQuestions[currentIdx];
        const correct = selectedOption !== null && selectedOption === q.answer;
        const updated = sessionAnswers.slice();
        updated[currentIdx] = { qid: q.id, selected: selectedOption, correct };
        setSessionAnswers(updated);

        // Update per-question progress (synced)
        setQbankProgress(prev => {
          const next = { ...prev };
          const existing = next[q.id] || { attempts: 0, correct: 0, lastSeen: 0, lastCorrect: false };
          next[q.id] = {
            attempts: existing.attempts + 1,
            correct: existing.correct + (correct ? 1 : 0),
            lastSeen: Date.now(),
            lastCorrect: correct,
          };
          return next;
        });

        if (currentIdx + 1 < sessionQuestions.length) {
          setCurrentIdx(currentIdx + 1);
          setSelectedOption(null);
          setRevealed(false);
        } else {
          setMode("results");
        }
      };

      const restart = () => {
        setMode("setup");
        setSessionQuestions([]);
        setSessionAnswers([]);
        setCurrentIdx(0);
        setSelectedOption(null);
        setRevealed(false);
      };

      // ====================================================
      // SETUP screen
      // ====================================================
      if (mode === "setup") {
        const noQuestionsAvailable = sectionsMeta.length === 0;
        return (
          <div style={{
            maxWidth: 760, margin: "0 auto", padding: "1.5rem 1rem",
            color: "#e6edf5", fontFamily: "'Avenir Next', 'Segoe UI', system-ui, sans-serif",
          }}>
            <h1 style={{ margin: "0 0 0.4rem", fontSize: "1.5rem" }}>🩺 Clinical Problem Solving</h1>
            <div style={{ color: "#9ab5cc", fontSize: "0.86rem", marginBottom: "1.2rem" }}>
              The MSRA's first paper. Single-best-answer and extended-matching style questions across the
              clinical curriculum, tagged to your notebook sections.
            </div>

            {noQuestionsAvailable ? (
              <div style={{
                background: "#1e1e30", padding: "1rem", borderRadius: 8,
                border: "1px solid #2a4a8a",
              }}>No questions available yet.</div>
            ) : (
              <>
                {/* Mode toggle */}
                <div style={{ marginBottom: "1.2rem" }}>
                  <div style={{ fontSize: "0.72rem", color: "#7a90b0", fontFamily: "monospace",
                                marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>Mode</div>
                  <div style={{ display: "inline-flex", background: "#1e1e30", borderRadius: 6,
                                padding: 3, border: "1px solid #2a4a8a" }}>
                    {[
                      { id: "practice", label: "Practice (immediate feedback)" },
                      { id: "mock", label: "Mock exam (results at end)" },
                    ].map(m => (
                      <button key={m.id} onClick={() => setPracticeMode(m.id)} style={{
                        padding: "0.45rem 0.95rem", borderRadius: 4, cursor: "pointer",
                        fontSize: "0.78rem", fontFamily: "monospace", fontWeight: 600,
                        background: practiceMode === m.id ? "#2a4a8a" : "transparent",
                        color: practiceMode === m.id ? "#fff" : "#9ab5cc", border: "none",
                      }}>{m.label}</button>
                    ))}
                  </div>
                </div>

                {/* Section selection */}
                <div style={{ marginBottom: "1.2rem" }}>
                  <div style={{ display: "flex", justifyContent: "space-between",
                                alignItems: "baseline", marginBottom: 6 }}>
                    <div style={{ fontSize: "0.72rem", color: "#7a90b0", fontFamily: "monospace",
                                  textTransform: "uppercase", letterSpacing: "0.08em" }}>Sections</div>
                    <div>
                      <button onClick={selectAll} style={{
                        background: "transparent", border: "1px solid #4a8adc",
                        color: "#7aa8e8", borderRadius: 4, fontSize: "0.7rem",
                        padding: "0.25rem 0.55rem", cursor: "pointer", fontFamily: "monospace",
                        marginRight: 6,
                      }}>All</button>
                      <button onClick={selectNone} style={{
                        background: "transparent", border: "1px solid #4a6a8a",
                        color: "#7a90b0", borderRadius: 4, fontSize: "0.7rem",
                        padding: "0.25rem 0.55rem", cursor: "pointer", fontFamily: "monospace",
                      }}>None</button>
                    </div>
                  </div>
                  <div style={{ display: "grid",
                                gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))",
                                gap: 8 }}>
                    {sectionsMeta.map(s => {
                      const isOn = selectedIds.has(s.id);
                      return (
                        <button key={s.id} onClick={() => toggleSection(s.id)} style={{
                          textAlign: "left", padding: "0.6rem 0.75rem", borderRadius: 6,
                          background: isOn ? "rgba(74,138,220,0.12)" : "#141a2b",
                          border: `1.5px solid ${isOn ? "#4a8adc" : "#2a2a45"}`,
                          color: isOn ? "#cfdcec" : "#7a90b0",
                          cursor: "pointer",
                          display: "flex", alignItems: "center", gap: 8,
                          fontSize: "0.82rem", fontFamily: "inherit",
                        }}>
                          <span style={{ fontSize: "1.05rem" }}>{s.icon}</span>
                          <span style={{ flex: 1, fontWeight: isOn ? 600 : 400 }}>{s.name}</span>
                          <span style={{ fontSize: "0.72rem", fontFamily: "monospace",
                                          color: isOn ? "#7aa8e8" : "#5a7090" }}>{s.count}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Question count selector */}
                <div style={{ marginBottom: "1.4rem" }}>
                  <div style={{ fontSize: "0.72rem", color: "#7a90b0", fontFamily: "monospace",
                                marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>
                    Number of questions
                  </div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {[5, 10, 20, 50, 100, "all"].map(n => {
                      const isOn = numQuestions === n;
                      return (
                        <button key={n} onClick={() => setNumQuestions(n)} style={{
                          padding: "0.4rem 0.85rem", borderRadius: 4,
                          background: isOn ? "#2a4a8a" : "transparent",
                          border: `1px solid ${isOn ? "#4a8adc" : "#2a4a8a"}`,
                          color: isOn ? "#fff" : "#9ab5cc",
                          fontFamily: "monospace", fontSize: "0.8rem",
                          cursor: "pointer", fontWeight: 600,
                        }}>{n === "all" ? "All" : n}</button>
                      );
                    })}
                  </div>
                  <div style={{ marginTop: 8, fontSize: "0.78rem", color: "#7a90b0",
                                fontFamily: "monospace" }}>
                    {totalAvailable} question{totalAvailable === 1 ? "" : "s"} in selected sections
                    {numQuestions !== "all" && totalAvailable > 0 && (
                      <> · {Math.min(numQuestions, totalAvailable)} will be drawn</>
                    )}
                  </div>
                </div>

                {/* Start */}
                <button onClick={startSession}
                  disabled={selectedIds.size === 0 || totalAvailable === 0}
                  style={{
                  padding: "0.85rem 1.4rem", borderRadius: 6,
                  background: (selectedIds.size === 0 || totalAvailable === 0)
                              ? "#2a2a45" : "#16a34a",
                  color: "#fff", border: "none",
                  fontFamily: "monospace", fontSize: "0.95rem", fontWeight: 700,
                  cursor: (selectedIds.size === 0 || totalAvailable === 0) ? "not-allowed" : "pointer",
                  letterSpacing: "0.05em",
                }}>▶ Start session</button>
              </>
            )}
          </div>
        );
      }

      // ====================================================
      // SESSION screen
      // ====================================================
      if (mode === "session") {
        const q = sessionQuestions[currentIdx];
        if (!q) return null;
        const total = sessionQuestions.length;
        const isPractice = practiceMode === "practice";
        const isMock = practiceMode === "mock";
        const isAnswered = selectedOption !== null;

        return (
          <div style={{
            maxWidth: 760, margin: "0 auto", padding: "1.2rem 1rem",
            color: "#e6edf5", fontFamily: "'Avenir Next', 'Segoe UI', system-ui, sans-serif",
          }}>
            {/* Header */}
            <div style={{ display: "flex", justifyContent: "space-between",
                          alignItems: "center", marginBottom: "0.8rem" }}>
              <div style={{ fontFamily: "monospace", fontSize: "0.78rem", color: "#9ab5cc" }}>
                Question <strong style={{ color: "#cfdcec" }}>{currentIdx + 1}</strong> / {total}
                <span style={{ marginLeft: 12, color: "#7a90b0" }}>
                  ({q.section.replace(/_/g, " ")})
                </span>
              </div>
              <button onClick={() => { if (confirm("Quit this session?")) restart(); }}
                style={{
                background: "transparent", border: "1px solid #4a6a8a",
                color: "#7a90b0", borderRadius: 4, fontSize: "0.72rem",
                padding: "0.3rem 0.65rem", cursor: "pointer", fontFamily: "monospace",
              }}>Quit</button>
            </div>

            {/* Progress bar */}
            <div style={{ height: 4, background: "#141a2b", borderRadius: 2,
                          marginBottom: "1.1rem", overflow: "hidden" }}>
              <div style={{
                width: `${(currentIdx / total) * 100}%`, height: "100%",
                background: "#4a8adc", transition: "width 0.3s",
              }} />
            </div>

            {/* Stem */}
            <div style={{
              background: "#141a2b", border: "1px solid #2a2a45",
              borderRadius: 8, padding: "1rem 1.1rem", marginBottom: "1rem",
              fontSize: "0.94rem", lineHeight: 1.55, color: "#e6edf5",
            }}>{q.stem}</div>

            {/* Options */}
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {q.options.map((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                const isSelected = selectedOption === idx;
                const isCorrect = idx === q.answer;
                let bg = "#141a2b";
                let border = "#2a2a45";
                let color = "#cfdcec";
                if (isPractice && revealed) {
                  if (isCorrect) { bg = "rgba(34,197,94,0.18)"; border = "#22c55e"; color = "#bff5cb"; }
                  else if (isSelected) { bg = "rgba(220,38,38,0.18)"; border = "#dc2626"; color = "#fecaca"; }
                } else if (isSelected) {
                  bg = "rgba(74,138,220,0.22)"; border = "#4a8adc"; color = "#cfdcec";
                }
                return (
                  <button key={idx} onClick={() => submitAnswer(idx)}
                    disabled={isPractice && revealed && !isSelected && !isCorrect}
                    style={{
                    textAlign: "left", padding: "0.7rem 0.9rem",
                    background: bg, border: `1.5px solid ${border}`, color,
                    borderRadius: 6, cursor: (isPractice && revealed) ? "default" : "pointer",
                    fontSize: "0.88rem", lineHeight: 1.4,
                    fontFamily: "inherit", display: "flex", gap: 10, alignItems: "flex-start",
                  }}>
                    <span style={{
                      flexShrink: 0, width: 24, height: 24, borderRadius: "50%",
                      background: "rgba(255,255,255,0.06)", color: "#7aa8e8",
                      display: "inline-flex", alignItems: "center", justifyContent: "center",
                      fontFamily: "monospace", fontSize: "0.78rem", fontWeight: 700,
                    }}>{letter}</span>
                    <span style={{ flex: 1 }}>{opt}</span>
                    {isPractice && revealed && isCorrect && <span style={{ color: "#22c55e" }}>✓</span>}
                    {isPractice && revealed && isSelected && !isCorrect && (
                      <span style={{ color: "#dc2626" }}>✗</span>
                    )}
                  </button>
                );
              })}
            </div>

            {/* Explanation (practice mode only, after answer) */}
            {isPractice && revealed && (
              <div style={{
                marginTop: "1rem",
                background: "rgba(74, 138, 220, 0.08)",
                border: "1px solid #4a8adc",
                borderLeft: "4px solid #4a8adc",
                borderRadius: 6, padding: "0.85rem 1rem",
                fontSize: "0.88rem", lineHeight: 1.55, color: "#cfdcec",
              }}>
                <div style={{ fontWeight: 700, color: "#7aa8e8", marginBottom: 4,
                              fontFamily: "monospace", fontSize: "0.72rem",
                              textTransform: "uppercase", letterSpacing: "0.08em" }}>
                  Explanation
                </div>
                {q.explanation}
              </div>
            )}

            {/* Next button */}
            <div style={{ marginTop: "1.1rem", display: "flex", justifyContent: "flex-end" }}>
              <button onClick={recordAndAdvance}
                disabled={!isAnswered}
                style={{
                  padding: "0.7rem 1.3rem", borderRadius: 6,
                  background: !isAnswered ? "#2a2a45" : "#4a8adc",
                  color: "#fff", border: "none",
                  fontFamily: "monospace", fontSize: "0.88rem", fontWeight: 700,
                  cursor: !isAnswered ? "not-allowed" : "pointer",
                  letterSpacing: "0.05em",
                }}>
                {currentIdx + 1 === total ? "Finish ►" : "Next ►"}
              </button>
            </div>
          </div>
        );
      }

      // ====================================================
      // RESULTS screen
      // ====================================================
      if (mode === "results") {
        const total = sessionAnswers.filter(a => a).length;
        const correct = sessionAnswers.filter(a => a && a.correct).length;
        const pct = total ? Math.round((correct / total) * 100) : 0;
        // Section breakdown
        const bySection = {};
        sessionQuestions.forEach((q, i) => {
          const a = sessionAnswers[i];
          if (!bySection[q.section]) bySection[q.section] = { total: 0, correct: 0 };
          bySection[q.section].total += 1;
          if (a && a.correct) bySection[q.section].correct += 1;
        });

        return (
          <div style={{
            maxWidth: 760, margin: "0 auto", padding: "1.5rem 1rem",
            color: "#e6edf5", fontFamily: "'Avenir Next', 'Segoe UI', system-ui, sans-serif",
          }}>
            <h1 style={{ margin: "0 0 0.4rem", fontSize: "1.5rem" }}>Session Results</h1>

            {/* Overall score */}
            <div style={{
              background: "#141a2b", border: `2px solid ${pct >= 70 ? "#22c55e" : pct >= 50 ? "#eab308" : "#dc2626"}`,
              borderRadius: 10, padding: "1.4rem", marginBottom: "1.2rem",
              textAlign: "center",
            }}>
              <div style={{
                fontSize: "3rem", fontWeight: 700,
                color: pct >= 70 ? "#22c55e" : pct >= 50 ? "#eab308" : "#dc2626",
                lineHeight: 1, marginBottom: 6,
              }}>{pct}%</div>
              <div style={{ fontFamily: "monospace", fontSize: "0.9rem", color: "#cfdcec" }}>
                {correct} / {total} correct
              </div>
            </div>

            {/* Section breakdown */}
            <div style={{ marginBottom: "1.2rem" }}>
              <div style={{ fontSize: "0.72rem", color: "#7a90b0", fontFamily: "monospace",
                            marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>
                By section
              </div>
              {Object.entries(bySection).map(([sid, st]) => {
                const sMeta = sectionsMeta.find(s => s.id === sid);
                const sPct = Math.round((st.correct / st.total) * 100);
                return (
                  <div key={sid} style={{
                    background: "#141a2b", padding: "0.55rem 0.85rem",
                    border: "1px solid #2a2a45", borderRadius: 6,
                    marginBottom: 5, display: "flex", alignItems: "center", gap: 10,
                  }}>
                    <span style={{ fontSize: "1rem" }}>{sMeta ? sMeta.icon : "📚"}</span>
                    <span style={{ flex: 1, fontSize: "0.86rem" }}>{sMeta ? sMeta.name : sid}</span>
                    <span style={{ fontFamily: "monospace", fontSize: "0.78rem", color: "#9ab5cc" }}>
                      {st.correct}/{st.total}
                    </span>
                    <span style={{
                      fontFamily: "monospace", fontSize: "0.8rem", fontWeight: 700, minWidth: 48, textAlign: "right",
                      color: sPct >= 70 ? "#22c55e" : sPct >= 50 ? "#eab308" : "#dc2626",
                    }}>{sPct}%</span>
                  </div>
                );
              })}
            </div>

            {/* Per-question review */}
            <div style={{ marginBottom: "1.5rem" }}>
              <div style={{ fontSize: "0.72rem", color: "#7a90b0", fontFamily: "monospace",
                            marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>
                Review questions
              </div>
              {sessionQuestions.map((q, i) => {
                const a = sessionAnswers[i];
                const wasCorrect = a && a.correct;
                return (
                  <details key={q.id} style={{
                    background: "#141a2b",
                    border: `1px solid ${wasCorrect ? "#22c55e44" : "#dc262644"}`,
                    borderLeft: `4px solid ${wasCorrect ? "#22c55e" : "#dc2626"}`,
                    borderRadius: 6, padding: "0.55rem 0.85rem", marginBottom: 5,
                    color: "#cfdcec",
                  }}>
                    <summary style={{ cursor: "pointer", fontSize: "0.84rem", listStyle: "none" }}>
                      <span style={{ color: wasCorrect ? "#22c55e" : "#dc2626", fontFamily: "monospace",
                                      marginRight: 8, fontWeight: 700 }}>
                        {wasCorrect ? "✓" : "✗"} Q{i + 1}
                      </span>
                      {q.stem.length > 110 ? q.stem.slice(0, 109) + "…" : q.stem}
                    </summary>
                    <div style={{ marginTop: 8, fontSize: "0.85rem", lineHeight: 1.5 }}>
                      <div style={{ marginBottom: 6 }}>{q.stem}</div>
                      {q.options.map((opt, oi) => (
                        <div key={oi} style={{
                          padding: "0.3rem 0.6rem", marginBottom: 3, borderRadius: 4,
                          background: oi === q.answer ? "rgba(34,197,94,0.18)"
                                      : (a && oi === a.selected ? "rgba(220,38,38,0.18)" : "transparent"),
                          color: oi === q.answer ? "#bff5cb"
                                  : (a && oi === a.selected ? "#fecaca" : "#9ab5cc"),
                          fontSize: "0.82rem",
                        }}>
                          <span style={{ fontFamily: "monospace", marginRight: 6, fontWeight: 700 }}>
                            {String.fromCharCode(65 + oi)}.
                          </span>
                          {opt}
                          {oi === q.answer && <span style={{ marginLeft: 6, color: "#22c55e" }}>✓ correct</span>}
                          {a && oi === a.selected && oi !== q.answer && <span style={{ marginLeft: 6 }}>(your answer)</span>}
                        </div>
                      ))}
                      <div style={{
                        marginTop: 8, padding: "0.55rem 0.75rem",
                        background: "rgba(74, 138, 220, 0.08)",
                        borderLeft: "3px solid #4a8adc", borderRadius: 4,
                        fontSize: "0.82rem", color: "#cfdcec", lineHeight: 1.5,
                      }}>
                        <strong style={{ color: "#7aa8e8" }}>Explanation:</strong> {q.explanation}
                      </div>
                    </div>
                  </details>
                );
              })}
            </div>

            <button onClick={restart} style={{
              padding: "0.75rem 1.3rem", borderRadius: 6,
              background: "#16a34a", color: "#fff", border: "none",
              fontFamily: "monospace", fontSize: "0.9rem", fontWeight: 700,
              cursor: "pointer", letterSpacing: "0.05em",
            }}>▶ New session</button>
          </div>
        );
      }

      return null;
    }

    // ===================================================================
    // PROFESSIONAL DILEMMAS (SJT) — the MSRA's second paper
    // ===================================================================
    const PD_DOMAINS = {
      integrity: { label: "Professional Integrity", short: "Integrity", color: "#a78bfa", icon: "⚖️" },
      pressure:  { label: "Coping with Pressure",   short: "Pressure",  color: "#f59e0b", icon: "🔥" },
      empathy:   { label: "Empathy & Sensitivity",  short: "Empathy",   color: "#fb7185", icon: "🫶" },
    };
    const PD_VIOLET = "#a78bfa";
    const ordinal = n => { const s = ["th","st","nd","rd"], v = (n + 1) % 100; return (n + 1) + (s[(v - 20) % 10] || s[v] || s[0]); };

    // Nearness scoring for a ranking: each response earns max(0, 4 - |chosen - ideal|).
    function scoreRanking(userOrder, correctOrder) {
      const idealPos = {};
      correctOrder.forEach((optIdx, pos) => { idealPos[optIdx] = pos; });
      let pts = 0;
      userOrder.forEach((optIdx, pos) => {
        const ideal = idealPos[optIdx];
        if (ideal != null) pts += Math.max(0, 4 - Math.abs(pos - ideal));
      });
      const max = correctOrder.length * 4;
      return { points: pts, max, frac: max ? pts / max : 0 };
    }
    function scoreMBA(selSet, correct) {
      let hit = 0;
      correct.forEach(i => { if (selSet.has(i)) hit++; });
      return { points: hit, max: correct.length, frac: correct.length ? hit / correct.length : 0 };
    }
    function pdScore(sc, ans) {
      if (sc.type === "rank") return scoreRanking(ans.userOrder || [], sc.correctOrder || []);
      return scoreMBA(new Set(ans.userSel || []), sc.correct || []);
    }
    const pctColor = p => (p >= 80 ? "#22c55e" : p >= 55 ? "#eab308" : "#f87171");

    function DilemmasView({ dilemmasProgress, setDilemmasProgress }) {
      const allScenarios = (window.DILEMMAS && window.DILEMMAS.scenarios) || [];
      const domainsMeta = useMemo(() => {
        const counts = {};
        allScenarios.forEach(s => { counts[s.domain] = (counts[s.domain] || 0) + 1; });
        return Object.keys(PD_DOMAINS).filter(d => counts[d])
          .map(d => ({ id: d, count: counts[d], ...PD_DOMAINS[d] }));
      }, [allScenarios]);

      const [mode, setMode] = useState("setup");
      const [selectedDomains, setSelectedDomains] = useState(() => new Set(Object.keys(PD_DOMAINS)));
      const [practiceMode, setPracticeMode] = useState("practice");
      const [numScenarios, setNumScenarios] = useState(5);

      const [session, setSession] = useState([]);
      const [answers, setAnswers] = useState([]);
      const [idx, setIdx] = useState(0);
      const [rankOrder, setRankOrder] = useState([]);
      const [mbaSel, setMbaSel] = useState(() => new Set());
      const [revealed, setRevealed] = useState(false);
      const [pending, setPending] = useState(null);

      useEffect(() => {
        if (domainsMeta.length && selectedDomains.size === 0) {
          setSelectedDomains(new Set(domainsMeta.map(d => d.id)));
        }
      }, [domainsMeta]);

      const totalAvailable = useMemo(
        () => allScenarios.filter(s => selectedDomains.has(s.domain)).length,
        [allScenarios, selectedDomains]
      );
      const toggleDomain = id => setSelectedDomains(prev => {
        const n = new Set(prev); if (n.has(id)) n.delete(id); else n.add(id); return n;
      });
      const resetWorking = () => { setRankOrder([]); setMbaSel(new Set()); setRevealed(false); setPending(null); };

      const start = () => {
        const pool = allScenarios.filter(s => selectedDomains.has(s.domain));
        if (!pool.length) return;
        const sh = pool.slice();
        for (let i = sh.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [sh[i], sh[j]] = [sh[j], sh[i]]; }
        const wanted = numScenarios === "all" ? sh.length : Math.min(numScenarios, sh.length);
        const sess = sh.slice(0, wanted);
        setSession(sess); setAnswers(new Array(sess.length).fill(null));
        setIdx(0); resetWorking(); setMode("session");
      };
      const restart = () => { setMode("setup"); setSession([]); setAnswers([]); setIdx(0); resetWorking(); };

      const cur = session[idx];
      const tapRank = optIdx => { if (revealed) return; setRankOrder(prev => prev.includes(optIdx) ? prev.filter(i => i !== optIdx) : [...prev, optIdx]); };
      const toggleMba = optIdx => {
        if (revealed) return;
        const pick = cur.pick || 3;
        setMbaSel(prev => { const n = new Set(prev); if (n.has(optIdx)) n.delete(optIdx); else if (n.size < pick) n.add(optIdx); return n; });
      };
      const isComplete = cur && (cur.type === "rank" ? rankOrder.length === cur.options.length : mbaSel.size === (cur.pick || 3));

      const doRecord = result => {
        const a = { id: cur.id, type: cur.type, domain: cur.domain, userOrder: [...rankOrder], userSel: [...mbaSel], frac: result.frac };
        const updated = answers.slice(); updated[idx] = a; setAnswers(updated);
        setDilemmasProgress(prev => {
          const next = { ...prev };
          const ex = next[cur.id] || { attempts: 0, bestFrac: 0, lastFrac: 0, lastSeen: 0 };
          next[cur.id] = { attempts: ex.attempts + 1, bestFrac: Math.max(ex.bestFrac, result.frac), lastFrac: result.frac, lastSeen: Date.now() };
          return next;
        });
      };
      const advance = () => { if (idx + 1 < session.length) { setIdx(idx + 1); resetWorking(); } else setMode("results"); };
      const submit = () => {
        if (!isComplete) return;
        const result = pdScore(cur, { userOrder: rankOrder, userSel: [...mbaSel] });
        if (practiceMode === "practice") { setPending(result); setRevealed(true); }
        else { doRecord(result); advance(); }
      };
      const nextScenario = () => { if (pending) doRecord(pending); advance(); };

      const wrap = { maxWidth: 760, margin: "0 auto", padding: "1.5rem 1rem", color: "#e6edf5", fontFamily: "'Avenir Next', 'Segoe UI', system-ui, sans-serif" };
      const labelStyle = { fontSize: "0.72rem", color: "#7a90b0", fontFamily: "'SF Mono', ui-monospace, monospace", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" };

      // ---------------- SETUP ----------------
      if (mode === "setup") {
        const none = domainsMeta.length === 0;
        return (
          <div style={wrap}>
            <h1 style={{ margin: "0 0 0.3rem", fontSize: "1.5rem" }}>⚖️ Professional Dilemmas</h1>
            <div style={{ color: "#9ab5cc", fontSize: "0.86rem", marginBottom: "1.3rem", lineHeight: 1.5 }}>
              The MSRA's second paper — a situational judgement test. Rank responses from most to least appropriate,
              or pick the most appropriate actions. Scoring rewards near-misses, just like the real exam.
            </div>
            {none ? (
              <div style={{ background: "#141a2b", padding: "1rem", borderRadius: 8, border: "1px solid #2a2a45" }}>
                No scenarios available yet.
              </div>
            ) : (
              <>
                <div style={{ marginBottom: "1.2rem" }}>
                  <div style={labelStyle}>Mode</div>
                  <div style={{ display: "inline-flex", background: "#141a2b", borderRadius: 6, padding: 3, border: "1px solid #2a2a45" }}>
                    {[{ id: "practice", label: "Practice (rationale after each)" }, { id: "mock", label: "Mock (scores at end)" }].map(m => (
                      <button key={m.id} onClick={() => setPracticeMode(m.id)} style={{
                        padding: "0.45rem 0.95rem", borderRadius: 4, cursor: "pointer", fontSize: "0.78rem",
                        fontFamily: "'SF Mono', ui-monospace, monospace", fontWeight: 600, border: "none",
                        background: practiceMode === m.id ? PD_VIOLET : "transparent",
                        color: practiceMode === m.id ? "#1a1030" : "#9ab5cc",
                      }}>{m.label}</button>
                    ))}
                  </div>
                </div>

                <div style={{ marginBottom: "1.2rem" }}>
                  <div style={labelStyle}>Themes</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 8 }}>
                    {domainsMeta.map(d => {
                      const on = selectedDomains.has(d.id);
                      return (
                        <button key={d.id} onClick={() => toggleDomain(d.id)} style={{
                          textAlign: "left", padding: "0.6rem 0.75rem", borderRadius: 6,
                          background: on ? d.color + "22" : "#141a2b",
                          border: `1.5px solid ${on ? d.color : "#2a2a45"}`,
                          color: on ? "#e6edf5" : "#7a90b0", cursor: "pointer",
                          display: "flex", alignItems: "center", gap: 8, fontSize: "0.84rem", fontFamily: "inherit",
                        }}>
                          <span style={{ fontSize: "1.05rem" }}>{d.icon}</span>
                          <span style={{ flex: 1, fontWeight: on ? 600 : 400 }}>{d.label}</span>
                          <span style={{ fontSize: "0.72rem", fontFamily: "'SF Mono', ui-monospace, monospace", color: on ? d.color : "#5a7090" }}>{d.count}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div style={{ marginBottom: "1.4rem" }}>
                  <div style={labelStyle}>Number of scenarios</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {[5, 10, 20, "all"].map(n => {
                      const on = numScenarios === n;
                      return (
                        <button key={n} onClick={() => setNumScenarios(n)} style={{
                          padding: "0.4rem 0.95rem", borderRadius: 4,
                          background: on ? PD_VIOLET : "transparent",
                          border: `1px solid ${on ? PD_VIOLET : "#3a3a5a"}`,
                          color: on ? "#1a1030" : "#9ab5cc", fontFamily: "'SF Mono', ui-monospace, monospace",
                          fontSize: "0.8rem", cursor: "pointer", fontWeight: 600,
                        }}>{n === "all" ? "All" : n}</button>
                      );
                    })}
                  </div>
                  <div style={{ marginTop: 8, fontSize: "0.78rem", color: "#7a90b0", fontFamily: "'SF Mono', ui-monospace, monospace" }}>
                    {totalAvailable} scenario{totalAvailable === 1 ? "" : "s"} in selected themes
                  </div>
                </div>

                <button onClick={start} disabled={selectedDomains.size === 0 || totalAvailable === 0} style={{
                  padding: "0.85rem 1.4rem", borderRadius: 6, border: "none",
                  background: (selectedDomains.size === 0 || totalAvailable === 0) ? "#2a2a45" : PD_VIOLET,
                  color: (selectedDomains.size === 0 || totalAvailable === 0) ? "#666" : "#1a1030",
                  fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.95rem", fontWeight: 700,
                  cursor: (selectedDomains.size === 0 || totalAvailable === 0) ? "not-allowed" : "pointer", letterSpacing: "0.04em",
                }}>▶ Start session</button>
              </>
            )}
          </div>
        );
      }

      // ---------------- SESSION ----------------
      if (mode === "session") {
        if (!cur) return null;
        const total = session.length;
        const dm = PD_DOMAINS[cur.domain] || { color: PD_VIOLET, label: cur.domain, icon: "⚖️" };
        const pick = cur.pick || 3;
        const correctSet = new Set(cur.correct || []);
        const idealPos = {}; (cur.correctOrder || []).forEach((o, p) => { idealPos[o] = p; });
        const result = pending || (revealed ? pdScore(cur, { userOrder: rankOrder, userSel: [...mbaSel] }) : null);

        return (
          <div style={{ ...wrap, padding: "1.2rem 1rem" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "0.7rem" }}>
              <div style={{ fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.78rem", color: "#9ab5cc" }}>
                Scenario <strong style={{ color: "#e6edf5" }}>{idx + 1}</strong> / {total}
              </div>
              <button onClick={() => { if (confirm("Quit this session?")) restart(); }} style={{
                background: "transparent", border: "1px solid #3a4a6a", color: "#7a90b0", borderRadius: 4,
                fontSize: "0.72rem", padding: "0.3rem 0.65rem", cursor: "pointer", fontFamily: "'SF Mono', ui-monospace, monospace",
              }}>Quit</button>
            </div>

            <div style={{ height: 4, background: "#141a2b", borderRadius: 2, marginBottom: "0.9rem", overflow: "hidden" }}>
              <div style={{ width: `${(idx / total) * 100}%`, height: "100%", background: PD_VIOLET, transition: "width 0.3s" }} />
            </div>

            <div style={{ display: "inline-flex", alignItems: "center", gap: 6, marginBottom: "0.7rem",
                          background: dm.color + "22", border: `1px solid ${dm.color}`, color: dm.color,
                          borderRadius: 20, padding: "0.2rem 0.7rem", fontSize: "0.72rem", fontWeight: 600 }}>
              <span>{dm.icon}</span>{dm.label}
            </div>

            <div style={{ background: "#141a2b", border: "1px solid #2a2a45", borderRadius: 8,
                          padding: "1rem 1.1rem", marginBottom: "0.9rem", fontSize: "0.94rem", lineHeight: 1.6, color: "#e6edf5" }}>
              {cur.stem}
            </div>

            <div style={{ fontSize: "0.8rem", color: "#a9b9d0", marginBottom: "0.7rem", fontStyle: "italic" }}>
              {cur.type === "rank"
                ? "Tap the responses in order, from most appropriate (1) to least appropriate."
                : `Select the ${pick} most appropriate actions.`}
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {cur.options.map((opt, oi) => {
                const rankPos = rankOrder.indexOf(oi);
                const isRanked = rankPos !== -1;
                const isSel = mbaSel.has(oi);
                let border = "#2a2a45", bg = "#0f1525", badgeBg = "rgba(255,255,255,0.06)", badgeColor = "#9ab5cc";
                if (cur.type === "rank") {
                  if (revealed) {
                    const diff = Math.abs(rankPos - idealPos[oi]);
                    const c = diff === 0 ? "#22c55e" : diff === 1 ? "#eab308" : "#f87171";
                    border = c; bg = c + "14"; badgeBg = c; badgeColor = "#0b1020";
                  } else if (isRanked) { border = PD_VIOLET; bg = PD_VIOLET + "1e"; badgeBg = PD_VIOLET; badgeColor = "#1a1030"; }
                } else {
                  if (revealed) {
                    if (correctSet.has(oi) && isSel) { border = "#22c55e"; bg = "rgba(34,197,94,0.14)"; }
                    else if (correctSet.has(oi)) { border = "#22c55e"; bg = "rgba(34,197,94,0.07)"; }
                    else if (isSel) { border = "#f87171"; bg = "rgba(248,113,113,0.14)"; }
                  } else if (isSel) { border = PD_VIOLET; bg = PD_VIOLET + "1e"; }
                }
                return (
                  <div key={oi}>
                    <button onClick={() => cur.type === "rank" ? tapRank(oi) : toggleMba(oi)} disabled={revealed} style={{
                      width: "100%", textAlign: "left", padding: "0.7rem 0.9rem", background: bg,
                      border: `1.5px solid ${border}`, color: "#e6edf5", borderRadius: 6,
                      cursor: revealed ? "default" : "pointer", fontSize: "0.88rem", lineHeight: 1.45,
                      fontFamily: "inherit", display: "flex", gap: 10, alignItems: "flex-start",
                    }}>
                      <span style={{ flexShrink: 0, width: 26, height: 26, borderRadius: cur.type === "rank" ? "50%" : 6,
                                     background: (cur.type === "rank" ? isRanked : isSel) || revealed ? badgeBg : "rgba(255,255,255,0.06)",
                                     color: (cur.type === "rank" ? isRanked : isSel) || revealed ? badgeColor : "#9ab5cc",
                                     display: "inline-flex", alignItems: "center", justifyContent: "center",
                                     fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.8rem", fontWeight: 700 }}>
                        {cur.type === "rank"
                          ? (isRanked ? rankPos + 1 : "")
                          : (isSel ? "✓" : "")}
                      </span>
                      <span style={{ flex: 1 }}>{opt}</span>
                      {revealed && cur.type === "rank" && (
                        <span style={{ flexShrink: 0, fontSize: "0.68rem", fontFamily: "'SF Mono', ui-monospace, monospace", color: "#9ab5cc" }}>
                          ideal {ordinal(idealPos[oi])}
                        </span>
                      )}
                      {revealed && cur.type === "mba" && correctSet.has(oi) && (
                        <span style={{ flexShrink: 0, color: "#22c55e", fontSize: "0.78rem" }}>✓</span>
                      )}
                    </button>
                    {revealed && cur.rationales && cur.rationales[oi] && (
                      <div style={{ fontSize: "0.78rem", color: "#aab8cc", lineHeight: 1.5, padding: "0.35rem 0.6rem 0.1rem 0.9rem" }}>
                        {cur.rationales[oi]}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {cur.type === "rank" && !revealed && (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "0.7rem" }}>
                <span style={{ fontSize: "0.76rem", color: "#7a90b0", fontFamily: "'SF Mono', ui-monospace, monospace" }}>
                  {rankOrder.length}/{cur.options.length} ranked
                </span>
                <button onClick={() => setRankOrder([])} style={{
                  background: "transparent", border: "1px solid #3a4a6a", color: "#9ab5cc", borderRadius: 4,
                  fontSize: "0.72rem", padding: "0.3rem 0.7rem", cursor: "pointer", fontFamily: "'SF Mono', ui-monospace, monospace",
                }}>Clear order</button>
              </div>
            )}
            {cur.type === "mba" && !revealed && (
              <div style={{ marginTop: "0.7rem", fontSize: "0.76rem", color: "#7a90b0", fontFamily: "'SF Mono', ui-monospace, monospace" }}>
                {mbaSel.size}/{pick} selected
              </div>
            )}

            {revealed && (
              <>
                <div style={{ marginTop: "1rem", display: "flex", alignItems: "center", gap: 10,
                              background: PD_VIOLET + "14", border: `1px solid ${PD_VIOLET}`, borderRadius: 6, padding: "0.6rem 0.9rem" }}>
                  <span style={{ fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.72rem", color: PD_VIOLET,
                                 textTransform: "uppercase", letterSpacing: "0.08em" }}>This scenario</span>
                  <span style={{ marginLeft: "auto", fontFamily: "'SF Mono', ui-monospace, monospace", fontWeight: 700,
                                 color: pctColor(Math.round(result.frac * 100)) }}>
                    {Math.round(result.frac * 100)}%  ·  {result.points}/{result.max} pts
                  </span>
                </div>
                {cur.explanation && (
                  <div style={{ marginTop: "0.8rem", background: "rgba(167,139,250,0.07)", border: `1px solid ${PD_VIOLET}55`,
                                borderLeft: `4px solid ${PD_VIOLET}`, borderRadius: 6, padding: "0.85rem 1rem",
                                fontSize: "0.86rem", lineHeight: 1.6, color: "#d7def0" }}>
                    <div style={{ fontWeight: 700, color: PD_VIOLET, marginBottom: 4, fontFamily: "'SF Mono', ui-monospace, monospace",
                                  fontSize: "0.7rem", textTransform: "uppercase", letterSpacing: "0.08em" }}>Why</div>
                    {cur.explanation}
                  </div>
                )}
              </>
            )}

            <div style={{ marginTop: "1.1rem", display: "flex", justifyContent: "flex-end" }}>
              {!revealed ? (
                <button onClick={submit} disabled={!isComplete} style={{
                  padding: "0.7rem 1.3rem", borderRadius: 6, border: "none",
                  background: !isComplete ? "#2a2a45" : PD_VIOLET, color: !isComplete ? "#666" : "#1a1030",
                  fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.88rem", fontWeight: 700,
                  cursor: !isComplete ? "not-allowed" : "pointer", letterSpacing: "0.04em",
                }}>Submit</button>
              ) : (
                <button onClick={nextScenario} style={{
                  padding: "0.7rem 1.3rem", borderRadius: 6, border: "none", background: PD_VIOLET, color: "#1a1030",
                  fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.88rem", fontWeight: 700, cursor: "pointer", letterSpacing: "0.04em",
                }}>{idx + 1 === total ? "Finish ►" : "Next ►"}</button>
              )}
            </div>
          </div>
        );
      }

      // ---------------- RESULTS ----------------
      if (mode === "results") {
        const done = answers.filter(Boolean);
        const avg = done.length ? done.reduce((s, a) => s + a.frac, 0) / done.length : 0;
        const pct = Math.round(avg * 100);
        const byDomain = {};
        done.forEach(a => { (byDomain[a.domain] = byDomain[a.domain] || []).push(a.frac); });

        return (
          <div style={wrap}>
            <h1 style={{ margin: "0 0 0.4rem", fontSize: "1.5rem" }}>Dilemmas Results</h1>
            <div style={{ background: "#141a2b", border: `2px solid ${pctColor(pct)}`, borderRadius: 10,
                          padding: "1.4rem", marginBottom: "1.2rem", textAlign: "center" }}>
              <div style={{ fontSize: "3rem", fontWeight: 700, color: pctColor(pct), lineHeight: 1, marginBottom: 6 }}>{pct}%</div>
              <div style={{ fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.85rem", color: "#cfdcec" }}>
                mean appropriateness across {done.length} scenario{done.length === 1 ? "" : "s"}
              </div>
            </div>

            <div style={{ marginBottom: "1.2rem" }}>
              <div style={{ ...labelStyle, marginBottom: 8 }}>By theme</div>
              {Object.entries(byDomain).map(([d, arr]) => {
                const dm = PD_DOMAINS[d] || { color: PD_VIOLET, label: d, icon: "⚖️" };
                const dp = Math.round(arr.reduce((s, x) => s + x, 0) / arr.length * 100);
                return (
                  <div key={d} style={{ background: "#141a2b", padding: "0.55rem 0.85rem", border: "1px solid #2a2a45",
                                        borderRadius: 6, marginBottom: 5, display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontSize: "1rem" }}>{dm.icon}</span>
                    <span style={{ flex: 1, fontSize: "0.86rem" }}>{dm.label}</span>
                    <span style={{ fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.78rem", color: "#9ab5cc" }}>{arr.length}</span>
                    <span style={{ fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.8rem", fontWeight: 700, minWidth: 48, textAlign: "right", color: pctColor(dp) }}>{dp}%</span>
                  </div>
                );
              })}
            </div>

            <div style={{ marginBottom: "1.5rem" }}>
              <div style={{ ...labelStyle, marginBottom: 8 }}>Review scenarios</div>
              {session.map((sc, i) => {
                const a = answers[i];
                const sp = a ? Math.round(a.frac * 100) : 0;
                const idealPos = {}; (sc.correctOrder || []).forEach((o, p) => { idealPos[o] = p; });
                const correctSet = new Set(sc.correct || []);
                return (
                  <details key={sc.id} style={{ background: "#141a2b", border: `1px solid ${pctColor(sp)}44`,
                                                borderLeft: `4px solid ${pctColor(sp)}`, borderRadius: 6, padding: "0.55rem 0.85rem", marginBottom: 5, color: "#cfdcec" }}>
                    <summary style={{ cursor: "pointer", fontSize: "0.84rem", listStyle: "none" }}>
                      <span style={{ color: pctColor(sp), fontFamily: "'SF Mono', ui-monospace, monospace", marginRight: 8, fontWeight: 700 }}>{sp}%</span>
                      S{i + 1} · {(PD_DOMAINS[sc.domain] || {}).short || sc.domain}
                    </summary>
                    <div style={{ marginTop: 8, fontSize: "0.84rem", lineHeight: 1.55 }}>
                      <div style={{ marginBottom: 8 }}>{sc.stem}</div>
                      {sc.options.map((opt, oi) => {
                        const isCorrect = sc.type === "mba" && correctSet.has(oi);
                        const userPos = sc.type === "rank" && a ? a.userOrder.indexOf(oi) : -1;
                        const userSel = sc.type === "mba" && a ? a.userSel.includes(oi) : false;
                        return (
                          <div key={oi} style={{ padding: "0.35rem 0.6rem", marginBottom: 4, borderRadius: 4, background: "#0f1525" }}>
                            <div style={{ display: "flex", gap: 8 }}>
                              <span style={{ flex: 1 }}>{opt}</span>
                              {sc.type === "rank" && (
                                <span style={{ fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.72rem", color: "#9ab5cc", whiteSpace: "nowrap" }}>
                                  you {userPos >= 0 ? ordinal(userPos) : "–"} · ideal {ordinal(idealPos[oi])}
                                </span>
                              )}
                              {sc.type === "mba" && (
                                <span style={{ fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.72rem", whiteSpace: "nowrap",
                                               color: isCorrect ? "#22c55e" : (userSel ? "#f87171" : "#5a7090") }}>
                                  {isCorrect ? "✓ best" : userSel ? "✗ yours" : "—"}
                                </span>
                              )}
                            </div>
                            {sc.rationales && sc.rationales[oi] && (
                              <div style={{ fontSize: "0.76rem", color: "#8fa0ba", marginTop: 3, lineHeight: 1.45 }}>{sc.rationales[oi]}</div>
                            )}
                          </div>
                        );
                      })}
                      {sc.explanation && (
                        <div style={{ marginTop: 8, padding: "0.55rem 0.75rem", background: "rgba(167,139,250,0.07)",
                                      borderLeft: `3px solid ${PD_VIOLET}`, borderRadius: 4, fontSize: "0.8rem", color: "#d7def0", lineHeight: 1.5 }}>
                          <strong style={{ color: PD_VIOLET }}>Why:</strong> {sc.explanation}
                        </div>
                      )}
                    </div>
                  </details>
                );
              })}
            </div>

            <button onClick={restart} style={{
              padding: "0.75rem 1.3rem", borderRadius: 6, background: PD_VIOLET, color: "#1a1030", border: "none",
              fontFamily: "'SF Mono', ui-monospace, monospace", fontSize: "0.9rem", fontWeight: 700, cursor: "pointer", letterSpacing: "0.04em",
            }}>▶ New session</button>
          </div>
        );
      }

      return null;
    }

    // -------- root --------
    function App() {
      const [hoursPerWeek, setHoursPerWeek] = useState(() => {
        const saved = +localStorage.getItem("msra_hours_per_week");
        return saved >= 3 && saved <= 40 ? saved : 14;
      });
      const [view, setView] = useState(() => localStorage.getItem("msra_view") || "today");
      const [statuses, setStatuses] = useState(() => {
        try { return JSON.parse(localStorage.getItem("msra_statuses") || "{}"); } catch { return {}; }
      });
      const [activeSpecialty, setActiveSpecialty] = useState(() =>
        localStorage.getItem("msra_active_specialty") || "cardiology"
      );
      const [notes, setNotes] = useState(() => {
        try { return JSON.parse(localStorage.getItem("msra_notes") || "{}"); } catch { return {}; }
      });
      const [statusChangedAt, setStatusChangedAt] = useState(() => {
        try { return JSON.parse(localStorage.getItem("msra_status_changed_at") || "{}"); } catch { return {}; }
      });
      const [notebookBookmarks, setNotebookBookmarks] = useState(() => {
        try { return JSON.parse(localStorage.getItem("msra_notebook_bookmarks") || "{}"); } catch { return {}; }
      });
      const [activeNotebookSectionId, setActiveNotebookSectionId] = useState(() =>
        localStorage.getItem("msra_notebook_section") || (window.NOTEBOOK?.sections?.[0]?.id || "haematology")
      );
      const [activeTopicId, setActiveTopicId] = useState(null);
      const [qbankProgress, setQbankProgress] = useState(() => {
        try { return JSON.parse(localStorage.getItem("msra_qbank_progress") || "{}"); } catch { return {}; }
      });
      const [dilemmasProgress, setDilemmasProgress] = useState(() => {
        try { return JSON.parse(localStorage.getItem("msra_dilemmas_progress") || "{}"); } catch { return {}; }
      });

      // ---- exam date / plan timeline (drives the whole schedule) ----
      const [examDate, setExamDate] = useState(() => localStorage.getItem("msra_exam_date") || window.EXAM_DATE);
      const [planStart, setPlanStart] = useState(() => localStorage.getItem("msra_plan_start") || window.PLAN_START);
      // Keep the module-level timeline in step with state, synchronously during render
      // so child views read the correct EXAM_DATE / DAYS_PER_STEP / PLAN_WEEKS.
      setTimeline(examDate, planStart);
      // First run = no saved state of any kind on this device. Existing users (with
      // progress, a sync code, or a previously chosen exam date) skip the landing page,
      // so nobody loses data.
      const [showOnboarding, setShowOnboarding] = useState(() => {
        const keys = ["msra_sync_code","msra_exam_date","msra_statuses","msra_status_changed_at","msra_qbank_progress","msra_hours_per_week","msra_view","msra_onboarded"];
        const hasState = keys.some(k => { const v = localStorage.getItem(k); return v && v !== "{}" && v !== "null" && v !== ""; });
        return !hasState;
      });

      // ---- sync state ----
      const [syncCode, setSyncCodeState] = useState(() => localStorage.getItem("msra_sync_code") || null);
      const [syncStatus, setSyncStatus] = useState(() =>
        FIRESTORE ? (localStorage.getItem("msra_sync_code") ? "connecting" : "idle") : "disabled"
      );
      const [lastSyncAt, setLastSyncAt] = useState(null);
      const [showSyncModal, setShowSyncModal] = useState(false);

      // Refs to prevent write-loops when applying remote snapshots
      const applyingRemote = useRef(false);
      const initialUploadDone = useRef(false);
      const writeTimer = useRef(null);

      const setSyncCode = useCallback(code => {
        if (code) {
          localStorage.setItem("msra_sync_code", code);
          initialUploadDone.current = false;
          setSyncCodeState(code);
        } else {
          localStorage.removeItem("msra_sync_code");
          initialUploadDone.current = false;
          setSyncCodeState(null);
          setSyncStatus(FIRESTORE ? "idle" : "disabled");
        }
      }, []);

      // Persist local state
      useEffect(() => { localStorage.setItem("msra_hours_per_week", hoursPerWeek); }, [hoursPerWeek]);
      useEffect(() => { localStorage.setItem("msra_view", view); }, [view]);
      useEffect(() => { localStorage.setItem("msra_statuses", JSON.stringify(statuses)); }, [statuses]);
      useEffect(() => { localStorage.setItem("msra_active_specialty", activeSpecialty); }, [activeSpecialty]);
      useEffect(() => { localStorage.setItem("msra_status_changed_at", JSON.stringify(statusChangedAt)); }, [statusChangedAt]);
      useEffect(() => { localStorage.setItem("msra_notebook_bookmarks", JSON.stringify(notebookBookmarks)); }, [notebookBookmarks]);
      useEffect(() => { localStorage.setItem("msra_qbank_progress", JSON.stringify(qbankProgress)); }, [qbankProgress]);
      useEffect(() => { localStorage.setItem("msra_dilemmas_progress", JSON.stringify(dilemmasProgress)); }, [dilemmasProgress]);
      useEffect(() => { localStorage.setItem("msra_notebook_section", activeNotebookSectionId); }, [activeNotebookSectionId]);
      useEffect(() => { localStorage.setItem("msra_exam_date", examDate); }, [examDate]);
      useEffect(() => { localStorage.setItem("msra_plan_start", planStart); }, [planStart]);
      // Restoring via a sync code (from the landing page) dismisses onboarding.
      useEffect(() => { if (syncCode) { setShowOnboarding(false); localStorage.setItem("msra_onboarded", "1"); } }, [syncCode]);
      // Any session that isn't the first-run landing page counts as onboarded — this
      // is what enables the "Keep my current plan" escape when reopening via ✎ edit.
      useEffect(() => { if (!showOnboarding) localStorage.setItem("msra_onboarded", "1"); }, [showOnboarding]);

      const toggleBookmark = useCallback(id => {
        setNotebookBookmarks(prev => {
          const u = { ...prev };
          if (u[id]) delete u[id]; else u[id] = true;
          return u;
        });
      }, []);

      // Single status setter — updates BOTH the rating and the change timestamp.
      const setStatus = useCallback((id, newStatus) => {
        setStatuses(prev => {
          const cur = prev[id] || "none";
          if (cur === newStatus) return prev;
          const u = { ...prev };
          if (!newStatus || newStatus === "none") delete u[id]; else u[id] = newStatus;
          return u;
        });
        setStatusChangedAt(prev => {
          const u = { ...prev };
          if (!newStatus || newStatus === "none") delete u[id]; else u[id] = Date.now();
          return u;
        });
      }, []);

      // Backfill: if a condition has a status but no timestamp, stamp it now.
      // Runs whenever either map changes; safe to re-run since it's idempotent
      // once timestamps exist.
      useEffect(() => {
        if (applyingRemote.current) return;
        const missing = Object.keys(statuses).filter(
          id => statuses[id] && statuses[id] !== "none" && !statusChangedAt[id]
        );
        if (missing.length === 0) return;
        const now = Date.now();
        setStatusChangedAt(prev => {
          const u = { ...prev };
          missing.forEach(id => { if (!u[id]) u[id] = now; });
          return u;
        });
      }, [statuses, statusChangedAt]);

      // ---- Firestore: read remote, listen for changes, do initial upload if empty ----
      useEffect(() => {
        if (!FIRESTORE || !syncCode) return;
        setSyncStatus("connecting");
        const docRef = FIRESTORE.collection("sync").doc(syncCode);
        const notesRef = docRef.collection("notes");

        // online/offline indicator
        const onOnline  = () => setSyncStatus(s => s === "offline" ? "synced" : s);
        const onOffline = () => setSyncStatus("offline");
        window.addEventListener("online",  onOnline);
        window.addEventListener("offline", onOffline);

        let mainUnsub = null, notesUnsub = null;

        docRef.get({ source: "server" }).catch(() => docRef.get()).then(snap => {
          applyingRemote.current = true;
          if (snap.exists) {
            const data = snap.data() || {};
            if (typeof data.hoursPerWeek === "number") setHoursPerWeek(data.hoursPerWeek);
            if (data.statuses && typeof data.statuses === "object") setStatuses(data.statuses);
            if (data.statusChangedAt && typeof data.statusChangedAt === "object") setStatusChangedAt(data.statusChangedAt);
            if (data.notebookBookmarks && typeof data.notebookBookmarks === "object") setNotebookBookmarks(data.notebookBookmarks);
            if (data.qbankProgress && typeof data.qbankProgress === "object") setQbankProgress(data.qbankProgress);
            if (data.dilemmasProgress && typeof data.dilemmasProgress === "object") setDilemmasProgress(data.dilemmasProgress);
            if (typeof data.examDate === "string") setExamDate(data.examDate);
            if (typeof data.planStart === "string") setPlanStart(data.planStart);
          } else {
            // First time using this code: upload current local state as the seed
            docRef.set({
              hoursPerWeek, statuses, statusChangedAt, notebookBookmarks, qbankProgress, dilemmasProgress, examDate, planStart,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            }, { merge: true }).catch(err => console.warn("seed write failed:", err));
          }
          // also pull any existing notes
          notesRef.get().then(qs => {
            if (!qs.empty) {
              const incoming = {};
              qs.forEach(d => { const v = d.data(); if (v && v.dataUrl) incoming[d.id] = v.dataUrl; });
              setNotes(prev => ({ ...prev, ...incoming }));
              try { localStorage.setItem("msra_notes", JSON.stringify({ ...JSON.parse(localStorage.getItem("msra_notes") || "{}"), ...incoming })); } catch {}
            } else if (!snap.exists) {
              // seed notes too on first time
              try {
                const localNotes = JSON.parse(localStorage.getItem("msra_notes") || "{}");
                Object.entries(localNotes).forEach(([id, dataUrl]) => {
                  notesRef.doc(id).set({
                    dataUrl,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                  }).catch(() => {});
                });
              } catch {}
            }
          }).finally(() => {
            applyingRemote.current = false;
            initialUploadDone.current = true;
            setLastSyncAt(Date.now());
            setSyncStatus(navigator.onLine === false ? "offline" : "synced");

            // Subscribe AFTER initial reconciliation
            mainUnsub = docRef.onSnapshot(s => {
              if (!s.exists) return;
              applyingRemote.current = true;
              const data = s.data() || {};
              if (typeof data.hoursPerWeek === "number") {
                setHoursPerWeek(prev => prev !== data.hoursPerWeek ? data.hoursPerWeek : prev);
              }
              if (data.statuses) {
                setStatuses(prev => JSON.stringify(prev) !== JSON.stringify(data.statuses) ? data.statuses : prev);
              }
              if (data.statusChangedAt) {
                setStatusChangedAt(prev => JSON.stringify(prev) !== JSON.stringify(data.statusChangedAt) ? data.statusChangedAt : prev);
              }
              if (data.notebookBookmarks) {
                setNotebookBookmarks(prev => JSON.stringify(prev) !== JSON.stringify(data.notebookBookmarks) ? data.notebookBookmarks : prev);
              }
              if (data.qbankProgress) {
                setQbankProgress(prev => JSON.stringify(prev) !== JSON.stringify(data.qbankProgress) ? data.qbankProgress : prev);
              }
              if (data.dilemmasProgress) {
                setDilemmasProgress(prev => JSON.stringify(prev) !== JSON.stringify(data.dilemmasProgress) ? data.dilemmasProgress : prev);
              }
              if (typeof data.examDate === "string") setExamDate(prev => prev !== data.examDate ? data.examDate : prev);
              if (typeof data.planStart === "string") setPlanStart(prev => prev !== data.planStart ? data.planStart : prev);
              setLastSyncAt(Date.now());
              // unset on next tick
              setTimeout(() => { applyingRemote.current = false; }, 0);
            }, err => { console.warn("main snapshot err:", err); setSyncStatus("error"); });

            notesUnsub = notesRef.onSnapshot(qs => {
              applyingRemote.current = true;
              setNotes(prev => {
                let updated = prev;
                qs.docChanges().forEach(change => {
                  const id = change.doc.id;
                  if (change.type === "removed") {
                    if (id in updated) { updated = { ...updated }; delete updated[id]; }
                  } else {
                    const data = change.doc.data();
                    if (data && data.dataUrl && updated[id] !== data.dataUrl) {
                      updated = { ...updated, [id]: data.dataUrl };
                    }
                  }
                });
                if (updated !== prev) {
                  try { localStorage.setItem("msra_notes", JSON.stringify(updated)); } catch {}
                }
                return updated;
              });
              setLastSyncAt(Date.now());
              setTimeout(() => { applyingRemote.current = false; }, 0);
            }, err => console.warn("notes snapshot err:", err));
          });
        }).catch(err => {
          console.warn("Firestore initial fetch failed:", err);
          setSyncStatus("error");
        });

        return () => {
          window.removeEventListener("online",  onOnline);
          window.removeEventListener("offline", onOffline);
          if (mainUnsub) mainUnsub();
          if (notesUnsub) notesUnsub();
        };
      }, [syncCode]);

      // ---- Debounced write of state changes to Firestore ----
      useEffect(() => {
        if (!FIRESTORE || !syncCode || !initialUploadDone.current) return;
        if (applyingRemote.current) return;
        clearTimeout(writeTimer.current);
        writeTimer.current = setTimeout(() => {
          FIRESTORE.collection("sync").doc(syncCode).set({
            hoursPerWeek, statuses, statusChangedAt, notebookBookmarks, qbankProgress, dilemmasProgress, examDate, planStart,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          }, { merge: true })
            .then(() => setLastSyncAt(Date.now()))
            .catch(err => { console.warn("write failed:", err); setSyncStatus("error"); });
        }, 700);
        return () => clearTimeout(writeTimer.current);
      }, [hoursPerWeek, statuses, statusChangedAt, notebookBookmarks, qbankProgress, dilemmasProgress, examDate, planStart, syncCode]);

      const setNote = useCallback((id, dataUrl) => {
        setNotes(prev => {
          const updated = { ...prev };
          if (dataUrl) updated[id] = dataUrl; else delete updated[id];
          try {
            localStorage.setItem("msra_notes", JSON.stringify(updated));
          } catch (err) {
            alert("Couldn't save note — browser storage is full. Try deleting older notes.");
            return prev;
          }
          return updated;
        });
        // Mirror to Firestore (don't write if change came FROM remote)
        if (FIRESTORE && syncCode && !applyingRemote.current) {
          const noteDoc = FIRESTORE.collection("sync").doc(syncCode).collection("notes").doc(id);
          if (dataUrl) {
            noteDoc.set({
              dataUrl,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            }).then(() => setLastSyncAt(Date.now()))
              .catch(err => console.warn("note write failed:", err));
          } else {
            noteDoc.delete().then(() => setLastSyncAt(Date.now())).catch(() => {});
          }
        }
      }, [syncCode]);

      const completeOnboarding = useCallback(dateStr => {
        const startStr = localISO();
        localStorage.setItem("msra_exam_date", dateStr);
        localStorage.setItem("msra_plan_start", startStr);
        localStorage.setItem("msra_onboarded", "1");
        setExamDate(dateStr);
        setPlanStart(startStr);
        setView("today");
        setShowOnboarding(false);
      }, []);

      // First-run landing page: choose an exam date (new plan) or restore via sync code.
      if (showOnboarding) {
        return (
          <div>
            <Onboarding onCreate={completeOnboarding} onRestore={() => setShowSyncModal(true)}
                        onCancel={localStorage.getItem("msra_onboarded") === "1" ? () => setShowOnboarding(false) : undefined} />
            {showSyncModal && (
              <SyncModal syncCode={syncCode} setSyncCode={setSyncCode} syncStatus={syncStatus}
                         lastSyncAt={lastSyncAt} onClose={() => setShowSyncModal(false)} />
            )}
          </div>
        );
      }

      return (
        <div>
          <Header hoursPerWeek={hoursPerWeek} setHoursPerWeek={setHoursPerWeek}
                  view={view} setView={setView}
                  onOpenSync={() => setShowSyncModal(true)}
                  syncStatus={syncStatus} onEditExam={() => setShowOnboarding(true)} />
          {view === "today"   && <TodayView   hoursPerWeek={hoursPerWeek} statuses={statuses}
                                              setView={setView} setActiveSpecialty={setActiveSpecialty} />}
          {view === "plan"    && <PlanView    hoursPerWeek={hoursPerWeek}
                                              setView={setView} setActiveSpecialty={setActiveSpecialty} />}
          {view === "tracker" && <TrackerView statuses={statuses} setStatus={setStatus}
                                              statusChangedAt={statusChangedAt}
                                              activeSpecialty={activeSpecialty}
                                              setActiveSpecialty={setActiveSpecialty}
                                              notes={notes} setNote={setNote} />}
          {view === "notebook" && <NotebookView
                                              activeNotebookSectionId={activeNotebookSectionId}
                                              setActiveNotebookSectionId={setActiveNotebookSectionId}
                                              activeTopicId={activeTopicId}
                                              setActiveTopicId={setActiveTopicId}
                                              bookmarks={notebookBookmarks}
                                              toggleBookmark={toggleBookmark} />}
          {view === "qbank"   && <QBankView qbankProgress={qbankProgress}
                                              setQbankProgress={setQbankProgress} />}
          {view === "dilemmas" && <DilemmasView dilemmasProgress={dilemmasProgress}
                                              setDilemmasProgress={setDilemmasProgress} />}
          {showSyncModal && (
            <SyncModal
              syncCode={syncCode}
              setSyncCode={setSyncCode}
              syncStatus={syncStatus}
              lastSyncAt={lastSyncAt}
              onClose={() => setShowSyncModal(false)}
            />
          )}
          <div style={{ textAlign: "center", padding: "1.2rem", fontSize: "0.7rem",
                        color: "#444", fontFamily: "monospace" }}>
            {syncCode
              ? <>Syncing across devices · code <span style={{ color: "#888" }}>{syncCode}</span></>
              : <>Saved locally in this browser · tap 🔄 Sync to share across devices</>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
